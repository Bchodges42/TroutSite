# tn-west — West TN — TWRA winter put-and-take lakes & park ponds.
# Editorial seasonal guidance, kept deliberately sparse: these 13 waters are
# winter put-and-take program lakes (stocked in the cold months; the stocked
# fish do not hold over summer). Cold months carry the stillwater staples a
# freshly stocked trout meets in a small lake or park pond (midges, scuds,
# sowbugs, leeches, aquatic worms) — the same fare the tn-middle-nashville
# winter-program chart carries. Warm months (Apr–Oct) list ONLY the permanent
# pond residents at minimum abundance: no trout guidance exists for a
# fishless warm season, so nothing is inflated. Abundance is seasonal
# guidance, not observed activity.
# Provenance: packages/content/streams/tn/*.yaml (regionId tn-west) notes and
# https://www.tn.gov/twra/fishing/trout-information-stockings.html
