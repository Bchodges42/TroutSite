# F2 DRAFT — per-species comfort & activity reference data (Stage 2).
# NOT wired into builds, validators, or the content pack. Research draft only;
# see f2-species-reference.md for evidence notes and citation gaps.
# Canonical units: tempC (values converted from cited °F figures; conversion
# noted per band). citationStatus: verified = value + source match; pending =
# gap — do not promote into the content pack.
schema: draft/f2-species-reference/0
updatedAt: '2026-09-12'

species:
  largemouth-bass:
    comfort:
      # Cited: optimum 82-84°F summer peak; comfort/activity ~65-75°F.
      lowerActiveC: 18.3        # 65°F (In-Fisherman activity zone)
      optimalC: [23.9, 28.9]    # 75-84°F (activity zone top through optimum)
      upperActiveC: 30.0        # ~86°F — above optimum, feed tapers
      avoidanceC: null          # pending: upper avoidance from thermal literature
      lethalC: null             # pending: upper incipient lethal
      citationStatus: partial
      sources:
        - https://www.in-fisherman.com/editorial/largemouth-bass-temperature-thermoclines/494247
    spawn:
      windowC: [15.6, 23.9]     # 60-75°F commonly cited for largemouth
      citationStatus: verified
      sources:
        - https://www.fishusa.com/learn/when-do-bass-spawn/
    flowTrend: { preference: heuristic-stable, citationStatus: pending }
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }

  smallmouth-bass:
    comfort:
      # Cited: most active feeding 68-80°F.
      lowerActiveC: 10.0        # 50°F — below this, feed slows (angler literature)
      optimalC: [20.0, 26.7]    # 68-80°F feeding peak
      upperActiveC: 28.0        # ~82°F — above optimal, seeks cooler water
      avoidanceC: null          # pending
      lethalC: null             # pending
      citationStatus: partial
      sources:
        - https://littleriveroutfitters.com/pages/fishing/smallmouth-reproduction.html
    spawn:
      windowC: [12.8, 21.1]     # 55-70°F
      citationStatus: verified
      sources:
        - https://littleriveroutfitters.com/pages/fishing/smallmouth-reproduction.html
        - https://www.fishusa.com/learn/when-do-bass-spawn/
    flowTrend: { preference: heuristic-stable, citationStatus: pending }
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }

  spotted-bass:
    comfort:
      # Interpolated between smallmouth and largemouth (general bass 55-80°F
      # spawn window source only) — needs species-specific primary source.
      lowerActiveC: null
      optimalC: [21.0, 27.0]
      upperActiveC: null
      avoidanceC: null
      lethalC: null
      citationStatus: pending
      sources:
        - https://www.fishusa.com/learn/when-do-bass-spawn/
    spawn:
      windowC: [15.6, 21.1]     # ~60-70°F (mid bass window; pending primary source)
      citationStatus: pending
      sources:
        - https://www.fishusa.com/learn/when-do-bass-spawn/
    flowTrend: { preference: heuristic-stable, citationStatus: pending }
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }

  crappie:
    comfort:
      lowerActiveC: null        # pending
      optimalC: [18.0, 24.0]    # pending primary source; draft from spawn-adjacent range
      upperActiveC: null
      avoidanceC: null
      lethalC: null
      citationStatus: pending
      sources:
        - https://www.tn.gov/twra/fishing/where-to-fish/cumberland-plateau-r3/watts-bar-reservoir.html
    spawn:
      # TWRA (Watts Bar page): white crappie 60-65°F, black crappie 62-68°F —
      # union covers both; keep the split for per-species work later.
      whiteCrappieC: [15.6, 18.3]   # 60-65°F
      blackCrappieC: [16.7, 20.0]   # 62-68°F
      windowC: [15.6, 20.0]
      citationStatus: verified
      sources:
        - https://www.tn.gov/twra/fishing/where-to-fish/cumberland-plateau-r3/watts-bar-reservoir.html
    flowTrend: { preference: heuristic-stable, citationStatus: pending }
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }

  bluegill:
    comfort:
      lowerActiveC: null        # pending
      optimalC: [23.9, 29.4]    # 75-85°F warmwater sunfish optimum (draft; pending primary)
      upperActiveC: null
      avoidanceC: null
      lethalC: null
      citationStatus: pending
      sources:
        - https://extension.missouri.edu/publications/g9473
    spawn:
      # MU Extension: most bluegill spawn at a minimum of 74°F, repeating
      # through summer. windowC = [23.3, 29.4] (74-85°F summer spawning season).
      windowC: [23.3, 29.4]
      citationStatus: verified
      sources:
        - https://extension.missouri.edu/publications/g9473
    flowTrend: { preference: heuristic-stable, citationStatus: pending }
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }

  channel-catfish:
    comfort:
      lowerActiveC: null        # pending
      optimalC: [25.0, 30.0]    # draft around spawn optimum ~80-81°F; pending primary
      upperActiveC: null
      avoidanceC: null
      lethalC: null
      citationStatus: pending
      sources:
        - https://catfishnow.com/spawning-time-facts/
    spawn:
      windowC: [21.1, 29.4]     # 70-85°F; optimum ~80-81°F (26.7-27.2°C)
      citationStatus: verified
      sources:
        - https://catfishnow.com/spawning-time-facts/
    flowTrend: { preference: heuristic-rising, citationStatus: pending } # channel cats feed on rising/high water (folklore-grade; pending)
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }

  striped-bass:
    comfort:
      # Management folklore grade until a TWRA/peer-reviewed citation lands.
      lowerActiveC: null
      optimalC: [15.6, 22.2]    # ~60-72°F coolwater preference (pending citation)
      upperActiveC: 23.9        # ~75°F — summer stress threshold (pending citation)
      avoidanceC: null
      lethalC: null
      citationStatus: pending
      sources: []               # REQUIRED before any value ships
    spawn:
      windowC: [15.0, 20.0]     # ~59-68°F (pending citation)
      citationStatus: pending
      sources: []               # REQUIRED before any value ships
    flowTrend: { preference: heuristic-stable, citationStatus: pending }
    pressureTrend: { sensitivity: heuristic-low, citationStatus: pending }
    notes: >-
      TN reservoir striped bass depend on cool tailwater refuges in July-Sept;
      summer stress/mortality behavior must be cited (TWRA reservoir pages or
      primary literature) before the scorer may use any band here.
