  year-round-trout on documented reach evidence (wild-trout reach: USFS campground upstream to USFS
  boundary near Munday Gap; lower corridor (campground to French Broad mouth) documented Oct 1-Jun
  under DH + seasonal programs) (ADR 0010 consistency).
