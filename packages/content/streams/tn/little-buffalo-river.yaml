  caveats:
    - Stocking weeks in 2026 are March 8, March 22, May 10 and May 31 - expect the best fishing
      immediately after releases.
    - TWRA documents no holdover, cold source, or wild trout for this creek; do not assume trout
      persist between or after stockings.
    - The Buffalo Creek (Grainger County) trout water in TWRA regulations is a different stream; so
