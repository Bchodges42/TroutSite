opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Chickamauga Lake as a major warmwater reservoir
    (largemouth/smallmouth/spotted bass, crappie, bluegill, catfish, striped bass) and stocks only
    striped bass, walleye, and Florida largemouth — no trout fishery is documented.
  reachScope: entire reservoir, Watts Bar Dam downstream to Chickamauga Dam (Hamilton, Bradley, Meigs,
    Rhea counties)
  asOf: "2026"
  sources:
    - label: Chickamauga Reservoir — Where to Fish
      url: https://www.tn.gov/twra/fishing/where-to-fish/cumberland-plateau-r3/chickamauga-reservoir.html
      kind: agency-assessment
      retrieved: 2026-09-22
      pinpoint: "Species list: largemouth/smallmouth/spotted bass, striped bass, black and white crappie,
        white/yellow bass, bluegill/redear/warmouth, walleye, sauger, blue/channel/flathead catfish,
        paddlefish, rock bass; no trout anywhere on the page"
  caveats:
    - The stocked 'N. Chickamauga Creek' in TWRA's schedule is a separate tributary creek, not the
      reservoir — adjacency trap.
    - Historical tailwater grabs at 03566510 reached 27.5 C in August (1977; prior lead, not
      re-verified) — warm releases, no cold plume documented.
