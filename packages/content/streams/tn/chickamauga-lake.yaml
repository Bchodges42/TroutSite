notes: >-
  Tennessee River reservoir above Chickamauga Dam (USGS 03566510 tailwater gauge, 35.10313/-85.22968) across
  Hamilton, Bradley, Meigs, and Rhea counties, extending up to Watts Bar Dam and receiving the Hiwassee River
  (hiwassee-river). TWRA maps the pool at 33,973 ac; TVA publishes 35,400 ac. TWRA's Chickamauga Reservoir
  page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish,
  striped bass (see officialSources). Striped bass is a regulatory or hybrid-evidence tag here; reservoir
  temperature/oxygen refuge context is not a scored input.


  Regulations: black bass 5/day combined, largemouth 15-in min; crappie 15/day, 10-in min; catfish no limit
  ≤34 in, only 1/day >34 in; striped/hybrid 2/day, 15-in min; walleye 5/day 16-in, sauger 10/day 15-in;
  paddlefish 2/day Apr 24–May 31; (retrieved 2026-09-14; verify current rules with TWRA before you go).
