notes: >-
  TVA reservoir on the Clinch River north of Knoxville across Anderson,
  Campbell, Claiborne, Grainger, and Union counties, impounded by Norris Dam
  (USGS 03533000 tailwater gauge, 36.21563/-84.08214). Receives the Clinch
  River and Powell River (powell-river); the dam releases the Clinch River
  Norris tailwater (clinch-river) into Melton Hill Lake. Verified geometry:
  Census TIGER/Line 2024 AREAWATER assembled by pool-membership rule (NHDPlus
  HR carries almost no named Norris pool — the shipped name-only polygon
  dropped every arm piece labeled "Clinch Riv"/"Powell Riv", leaving 30
  disconnected county fragments). Cross-checks: NHD medium-res GNIS 01269832
  (95.5 km²), TWRA pool outline (36,149 ac incl. riverine arms), TVA published
  33,840 ac at summer normal. Aliases: Norris Reservoir.
