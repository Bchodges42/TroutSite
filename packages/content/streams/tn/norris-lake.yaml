notes: >-
  TVA reservoir on the Clinch River north of Knoxville across Anderson, Campbell, Claiborne, Grainger,
  and Union counties, impounded by Norris Dam (USGS 03533000 tailwater gauge). Receives the Clinch
  River and Powell River (powell-river); the dam releases the Clinch River Norris tailwater
  (clinch-river) into Melton Hill Lake. Aliases: Norris Reservoir. TVA's summer-normal full pool is
  about 33,840 acres, and the pool outline runs far up the Clinch and Powell arms — expect shorelines
  and access points to follow the impounded river channels.
  TWRA's Norris Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).

