opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Norris Reservoir as a warmwater fishery — smallmouth and largemouth bass,
    striped bass, crappie, walleye — with heavy non-trout stocking (~103,000 striper and ~103,000
    crappie fingerlings, ~240,000 walleye annually) and no trout anywhere in its fishery
    documentation; the trout fishery TWRA manages on this system is the tailwater below the dam.
  reachScope: Norris Lake (Norris Reservoir) pool — TVA impoundment of the Clinch and Powell rivers
    across Anderson/Campbell/Claiborne/Grainger/Union counties; excludes the Clinch River Norris
    tailwater below Norris Dam (catalog clinch-river)
  asOf: "2026"
  sources:
    - label: TWRA Norris Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/norris-reservoir.html
      kind: agency-assessment
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: '"Norris is noted for its Smallmouth Bass fishing. The best fishing is from November to
        April."; "Norris receives about 103,000 Striped Bass fingerlings every year."; "...stocking
        about 103,000 crappies into the reservoir every year."; "About 240,000 fish are released
        [walleye] with the majority of these being Lake Erie strain." The word "trout" appears
        nowhere in the fishery body (verified 2026-09-22).'
  caveats:
    - Warmwater-focus is a documentation statement, not a biological absence claim.
    - The documented trout water on this system is the Clinch River Norris TAILWATER below the dam
      (~14 miles to Hwy 61, catalog clinch-river) — dam-blocked from the lake and never transferring
      to it.
    - The lake's Clinch and Powell arms run far upstream; upper-arm habitat differs from the main
      pool — any future trout question must be arm-specific.
