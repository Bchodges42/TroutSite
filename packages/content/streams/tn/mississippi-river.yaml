notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Mississippi forms Tennessee's
  western boundary past Shelby, Tipton, Lauderdale, Dyer, and Lake counties. Detailed angler notes
  are still being prepared — check TWRA and local access areas in the meantime.


  Regulations: Mississippi River block as above (bass 10, crappie 50, catfish no-creel/1-over-34,
  stripers 6, sauger 6, white bass 30, sunfish 50); statewide catfish rule agrees (only one catfish
  over 34 in per day; no harvest limit under 34 in) (retrieved 2026-09-14; verify current rules with
  TWRA before you go).
