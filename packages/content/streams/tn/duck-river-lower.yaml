  statement: TWRA documents the Duck River from Shelbyville to Columbia as a warmwater
    bass-and-catfish river — largemouth/spotted bass at the Henry Horton stretch and excellent-size
    catfish downstream — with no trout program on this reach.
  reachScope: Shelbyville (Hwy 41A) to Columbia — below the Normandy tailwater trout water
