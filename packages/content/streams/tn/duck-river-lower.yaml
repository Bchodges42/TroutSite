        trout' in the tailwater reach '8 months' (Nov-Jun window, dam to Three Forks Bridge)"
    - label: Discrete water temperature, Duck River at Columbia / near Shelbyville
      url: https://www.waterqualitydata.us/data/Result/search?siteid=USGS-03599500&characteristicName=Temperature%2C%20water&mimeType=csv
