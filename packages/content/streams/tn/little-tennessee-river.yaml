opportunity:
  trout: seasonal-stocked-trout
  evidenceState: documented
  statement: "TWRA documents a seasonal stocked trout fishery in the Little Tennessee Arm of Tellico
    Reservoir below Chilhowee Dam: about 4,500 catchable rainbow trout are released there in the
    late winter and early spring each year, where cold, well-oxygenated Chilhowee releases can
    support trout."
  reachScope: Little Tennessee Arm of Tellico Reservoir below Chilhowee Dam (upper arm)
  asOf: "2026"
  sources:
    - label: TWRA Tellico Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/tellico-reservoir.html
      kind: schedule-table
      observationPeriod: current page, live check
      retrieved: 2026-09-22
      pinpoint: "verified live 2026-09-22: 'The upper reaches of Tellico Reservoir in the Little Tennessee
        Arm below Chilhowee Dam can support trout'; 'About 4,500 catchable Rainbow Trout are
        released there in the late winter and early spring annually'; 'General trout regulations
        apply at Tellico with a seven-fish daily creel limit and no minimum size limit'"
  caveats:
    - This is an impounded-arm reservoir trout fishery - never a trout stream.
    - General trout regs (7/day, no length) apply at Tellico.
    - The Calderwood and Chilhowee pools and the lower river to Tellico Dam are separate questions
      with no trout documentation found.
