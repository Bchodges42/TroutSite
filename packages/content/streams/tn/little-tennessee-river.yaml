notes: >-
  Main-stem river entering Tennessee from North Carolina below Fontana Dam, flowing through the Calderwood and
  Chilhowee pools and Tellico Lake (impounded reaches are carried by the lake features; no tailwater condition
  scoring is applied across a reservoir) to its mouth at the Tennessee River in Fort Loudoun Lake below
  Tellico Dam. The 33-mile dam-to-dam corridor is the Little T of TVA's main- stem sequence; the trout-stocked
  upper water is the reach below Chilhowee Dam — verify current TWRA schedules. Distinct from the Tellico
  River (tellico-river), a different tributary near Tellico Plains. USGS 03519750 (Little Tennessee River at
  Davis Ferry) sits mid-pool.


  Stocked trout fishery confirmed by agency sources (retrieved 2026-09-14) — Trout water is the
  Chilhowee-tailwater reach (upper Little Tennessee arm); late-winter/early-spring rainbow plants per TWRA.


  Regulations: Tellico Lake Chota Refuge Unit (Little Tennessee River Miles 26.0 upstream to 29.7) closed to
  all forms of use and trespass Nov 15–Feb 28 except in designated observation areas (retrieved 2026-09-14;
  verify current rules with TWRA before you go).
