  evidenceState: documented
  statement: TWRA names Watauga among the reservoirs it stocks 'to provide year-round trout fishing
    opportunities' (lake trout and rainbow), and its reservoir page documents a cold,
    well-oxygenated lake trout fishery whose summer fishing is deep water — 90 to 120 feet for lake
    trout.
  reachScope: Watauga Lake (Watauga Reservoir) pool, Carter/Johnson counties — the reservoir impounded
    by Watauga Dam; excludes the Watauga-Dam-to-Wilbur reach, Wilbur Lake, and the Wilbur tailwater
    downstream
