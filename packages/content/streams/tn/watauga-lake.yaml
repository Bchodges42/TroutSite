      pinpoint: '"TWRA stocks the following reservoirs with trout to provide year-round trout fishing
        opportunities." List line: "Region IV, Watauga - Lake and Rainbow". Capture:
        captures/twra-trout-page.txt; verified live 2026-09-22.'
    - label: TWRA Watauga Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/watauga-reservoir.html
      kind: schedule-table
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: '"TWRA has stocked rainbow, brown, and lake trout in the reservoir."; "Lake trout... is a
        non-native species selected for stocking because of the cold, well-oxygenated, habitat
        present." Verified live 2026-09-22.'
  caveats:
    - "SUMMER FISHING IS DEEP WATER: TWRA directs summer anglers to troll 30-50 ft for rainbow/brown
      and 90-120 ft for lake trout (best lake-trout water between Watauga Point and Butler Bridge).
      This is a boat fishery in summer — nothing here promises bank or shoreline fishing."
    - Water levels can fluctuate up to 44 feet between summer full pool and winter drawdown — access
      and fish location shift with the pool.
    - This verdict is for the LAKE. The famous Watauga River trout water begins below Wilbur Dam
      (separate catalog water); the reservoir list supports the lake, the forecast supports the
      river — never cross-assign them.
    - Reservoir trout fisheries are trout FISHERIES, not trout streams — wording on any published
      surface must follow rule 6.
