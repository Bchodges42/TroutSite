notes: >-
  TVA reservoir on the Watauga River in the mountains of Carter and Johnson
  counties, impounded by Watauga Dam (between USGS 03483450 above and 03483950
  below; tailwater gauge 36.33011/-82.12596). One of the highest reservoirs in
  the TVA system; its tailwater and Wilbur Lake carry the famous Watauga trout
  fishery downstream. Outflow runs via the short Watauga River reach
  (watauga-river-wilbur-reach) into Wilbur Lake. The pool runs all the way to
  the dam at its west end. Aliases: Watauga Reservoir.
