notes: >-
  TVA reservoir on the Watauga River in the mountains of Carter and Johnson counties, impounded by
  Watauga Dam (between USGS 03483450 above and 03483950 below; tailwater gauge 36.33011/-82.12596).
  One of the highest reservoirs in the TVA system; its tailwater and Wilbur Lake carry the famous
  Watauga trout fishery downstream. Outflow runs via the short Watauga River reach
  (watauga-river-wilbur-reach) into Wilbur Lake. The pool runs all the way to the dam at its west
  end. Aliases: Watauga Reservoir. TWRA's Watauga Reservoir page lists the fishery as largemouth
  bass, smallmouth bass, spotted bass, crappie, bluegill, catfish (see officialSources).


  Stocked trout fishery documented by agency sources in the 2026-09 wave-ledger sourcing pass
  (retrieved 2026-09-14) — TMP trout reservoir ("Region IV, Watauga — Lake and Rainbow"); months
  unpinned.


  Regulations: "There is no size limit for either species, but there is a daily limit of 7; only two
  of which can be lake trout" (page) — matches statewide trout regs: 7 trout/day any combination, no
  minimum length, only 2 may be Lake Trout (retrieved 2026-09-14; verify current rules with TWRA
  before you go).


  Correction (2026-09-22, evidence ledger): yearRound false → true — the adjudicated headline is
  year-round-trout on documented reach evidence (Watauga Lake (Watauga Reservoir) pool,
  Carter/Johnson counties — the reservoir impounded by Watauga Dam; excludes the
  Watauga-Dam-to-Wilbur reach, Wilbur Lake, and the Wilbur tailwater downstream) (ADR 0010
  consistency).
