  statement: "Scheduled TWRA spring put-and-take on Gulf Fork Big Creek (Cocke County): five 2026
    rainbow stockings (Feb 22 - May 17); TWRA's Trout Management Plan separately names this stream's
    tributaries (Middle Prong Gulf Creek, Brown Gap Creek) as a native brook trout donor source -
    wild brook evidence for the tributaries, not the stocked main reach."
