notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Cumberland River
  reservoir east of Nashville across Davidson, Sumner, Wilson, Smith, and Trousdale
  counties. Detailed angler notes are still being prepared — check TWRA and local
  access areas in the meantime.
  TWRA's Old Hickory Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
  Striped bass is a regulatory or hybrid-evidence tag here; reservoir temperature/oxygen refuge context is not a scored input.
