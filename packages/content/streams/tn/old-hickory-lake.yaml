opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Old Hickory Reservoir (22,500 acres on the Cumberland River northeast of
    Nashville) as a warmwater fishery with major TWRA stocking programs for striped bass, walleye
    and sauger; no trout program or trout fishery is documented.
  asOf: "2026"
  sources:
    - label: Old Hickory Reservoir — Where to Fish
      url: https://www.tn.gov/twra/fishing/where-to-fish/middle-tennessee-r2/old-hickory-reservoir.html
      kind: agency-assessment
      observationPeriod: current page content
      retrieved: 2026-09-22
      pinpoint: "Species list: black bass (largemouth/smallmouth/spotted), crappie (white & black),
        catfish (channel/flathead/blue), striped & hybrid bass, white/yellow bass, walleye, sauger,
        paddlefish, rock bass, redear, bluegill, warmouth; 'This fishery [striped bass] is totally
        dependent on annual stockings provided by Tennessee Wildlife Resources Agency fish
        hatcheries'; world-record walleye 1960; no trout mention on the page"
  caveats:
    - No trout stocking row exists for this reservoir in TWRA's 2026 schedule or stocking-point GIS
      layer.
    - Nearby Davidson County winter trout sites (Shelby Bottoms, Cedar Hill Park Pond, Marrowbone
      Lake) are separate waters.
    - Warmwater-focus does not mean trout are biologically absent.
