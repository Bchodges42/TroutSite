notes: >-
  Ocoee River impoundment (TVA Ocoee Dam No. 1, "Parksville Dam") in Polk
  County southeast of Benton; the dam sits at the pool's west edge. Receives
  the upper Ocoee River (ocoee-river) below Ocoee Number Three Lake and
  discharges through the dam into the Parksville tailwater
  (parksville-tailwater), which joins the Hiwassee River. TWRA lists the same
  pool as "Ocoee Lake" (2,112 ac). Aliases: Ocoee Lake, Ocoee Lake No. 1,
  Parksville Reservoir.
  TWRA's Parksville Reservoir page lists the fishery as largemouth bass, spotted bass, crappie, bluegill (see officialSources).
