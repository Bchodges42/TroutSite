id: ocoee-number-three-lake
name: Ocoee Number Three Lake
stateId: TN
waterbodyType: lake
regionId: tn-se-hiwassee
gaugeIds: []
stockingProgram: false
idealFlow: []
notes: >-
  Small (≈550 acre) impoundment of the Ocoee River in Polk County upstream of
  Parksville Lake, created by TVA's Ocoee Dam No. 3. The upper Ocoee
  (ocoee-river) enters from the Copperhill end and resumes below the dam toward
  Parksville Lake. TWRA records this same pool under the historical name
  "Hiwassee Lake" (443 ac) — that label does not refer to the Hiwassee Lake in
  North Carolina.
