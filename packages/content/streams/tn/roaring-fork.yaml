  statement: "Roaring Fork carries a documented year-round trout opportunity on two reaches: TWRA's
    forecast names it a stocked Gatlinburg stream (rainbows from the West Prong confluence to the
    park boundary, 'Stocking: Year-Round'), and the steep park reach above holds wild trout under
    NPS no-stocking-since-1975 policy."
  reachScope: "Two reaches: (1) Gatlinburg city reach - WPLP confluence to park boundary, stocked
    rainbows; (2) GSMNP park reach along the Motor Nature Trail - wild trout"
