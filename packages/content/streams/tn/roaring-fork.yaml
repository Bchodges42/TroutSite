notes: >-
  Steep, cascading park water off the Roaring Fork Motor Nature Trail — wild rainbows and brook
  trout, with TWRA year-round program (Gatlinburg DH + weekly rainbows to the park boundary); the
  park reach is wild. No gauge; treat flows as rain events.


  Regulations: park-wide NPS rules — 5 fish combo, 7 in min trout/bass, single-hook artificials
  only, no bait/scent, year-round (retrieved 2026-09-14; verify current rules with TWRA before you
  go).


  Triage apply (2026-09-24): fishery → 'wild+stocked' (ADR 0011): wild park reach + TWRA year-round
  Gatlinburg program (DH + weekly rainbows stocked to the park boundary)
