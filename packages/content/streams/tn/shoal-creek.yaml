  statement: "The catalog's spring-stocked-trout claim for Shoal Creek conflicts with TWRA's current
    program: the verified 2026 schedule has zero rows for Shoal Creek (only East Fork Shoal Creek, a
    different water), while newspaper-era reports describe historical winter plants at Lawrenceburg
    parks. Unresolved - both sides preserved."
  asOf: "2026"
  caveats:
    - Do not confuse with East Fork Shoal Creek (stocked 5 spring weeks 2026) - a different catalog
      water.
    - The catalog's 'spring-fed' note has no agency documentation found.
    - No wild-trout, delayed-harvest, or special-regulation listing exists for this creek.
  unresolvedQuestion: Does TWRA currently (any recent year) stock the Shoal Creek main stem at
    Lawrenceburg - and if so, when and at which parks? The current 2026 schedule says no; historical
    reporting says yes.
