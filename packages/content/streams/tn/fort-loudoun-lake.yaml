notes: >-
  TVA reservoir at Knoxville across Knox, Blount, and Loudon counties,
  impounded by Fort Loudoun Dam (USGS 03499510 tailwater gauge,
  35.79174/-84.24325; Tennessee River mile 602.3). Formed by the Holston and
  French Broad main stems and the Little Tennessee arm (Tellico Lake joins via
  the canal); discharges into Watts Bar Lake. TVA lists the reservoir at
  14,600 ac at normal summer pool. Aliases: Fort Loudoun Reservoir.
