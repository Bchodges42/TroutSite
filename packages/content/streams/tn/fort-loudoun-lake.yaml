  statement: TWRA documents Fort Loudoun Lake as a shallow mainstem Tennessee River reservoir with an
    entirely warmwater fishery — black bass, crappie, bluegill, catfish, striped/hybrid bass — and
    no trout fishery is documented.
  reachScope: entire reservoir, Fort Loudoun Dam upstream 55 miles to the Holston/French Broad
    confluence (Knox, Blount, Loudon counties)
