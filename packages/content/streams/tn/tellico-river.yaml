  caveats:
    - "Reach structure (per TWRA and dated shop reports): upper river above the North River
      confluence = year-round cold water with wild rainbow/brown reproduction; Bald River
      Falls/Green Cove corridor and lower mainstem = seasonal stocked fishery whose permit season
      ends Aug 15 and whose summer viability fades below Bald River."
    - "Free-flowing rain-flashy mountain river: wading difficult above ~300 cfs on the USGS 03518500
      Tellico Plains gauge (node n-eJ7NRx)."
    - "Do not conflate with Tellico Lake: the reservoir's 'Tellico (Upper)' trout program is a
      separate catalog water (tellico-lake)."
