  evidenceState: documented
  statement: TWRA intensively manages 13 miles of the Tellico River with heavy stocking and a
    delayed-harvest season, and documents year-round trout water at higher elevations (wild rainbow
    and brown reproduction above the North River confluence); the lower stocked river is seasonal,
    depending on elevation.
  reachScope: "Year-round reach: North River confluence upstream to the TN/NC state line (higher
    elevations; wild rainbow/brown reproduction documented there). The lower mainstem (Turkey
    Creek/North River corridor, incl. Green Cove downstream of Bald River) is a seasonal stocked
    fishery: weekly stockings Mar-Jul/Aug, permit season ends Aug 15."
  asOf: "2026"
