opportunity:
  trout: year-round-trout
  evidenceState: documented
  statement: TWRA names South Holston among the reservoirs it stocks 'to provide year-round trout
    fishing opportunities' (lake trout and rainbow), and its reservoir page documents a deep, cool
    trout fishery — with the caveat that summer dissolved oxygen can fall below optimum and limit
    success, especially for lake trout.
  reachScope: South Holston Lake (South Holston Reservoir) pool above South Holston Dam — Tennessee
    portion (Sullivan County) plus the Virginia portion of the impoundment; excludes the South
    Holston tailwater below the dam (separate catalog water)
  asOf: "2026"
  sources:
    - label: TWRA trout information page — reservoirs stocked to provide year-round trout fishing
        opportunities
      url: https://www.tn.gov/twra/fishing/trout-information-stockings.html
      kind: agency-assessment
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: '"TWRA stocks the following reservoirs with trout to provide year-round trout fishing
        opportunities." List line: "Region IV, South Holston - Lake and Rainbow". Capture:
        captures/twra-trout-page.txt; verified live 2026-09-22.'
    - label: TWRA South Holston Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/south-holston-reservoir.html
      kind: schedule-table
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: '"TWRA annually stocks good numbers of trout and many of them are harvested by anglers.";
        summer tips: "troll spoons at 30 to 50 feet deep for rainbows and browns and 90 feet deep
        for Lake Trout." Verified live 2026-09-22.'
  caveats:
    - "SUMMER FISHING IS DEEP WATER: TWRA's summer guidance is trolling 30-50 ft for rainbows/browns
      and 90 ft for lake trout. Nothing here promises bank or shoreline fishing."
    - Summer dissolved oxygen can fall below optimum and limit the fishery, especially lake trout
      (TWRA's own caveat).
    - This verdict is for the LAKE above South Holston Dam. The famous wild-brown tailwater is below
      the dam and is a separate catalog water — findings never transfer in either direction.
    - The reservoir crosses into Virginia (~1,250 ac per prior lead, not re-verified); the mapped
      feature covers the full pool while TWRA's program statement is Tennessee's.
