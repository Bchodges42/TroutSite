notes: >-
  TVA reservoir on the South Fork Holston River above Bristol (Sullivan County, Tennessee, and
  Washington County, Virginia), impounded by South Holston Dam (USGS 03476500 tailwater gauge,
  36.52356/-82.09726). Discharges the South Holston tailwater (south-holston-river) toward Boone
  Lake. The lake crosses the state line into Virginia, so the mapped water covers the full
  reservoir. TWRA maps the Tennessee portion at 6,019 ac; TVA publishes 7,580 ac at full pool.
  TWRA's South Holston Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted
  bass, crappie, bluegill, catfish (see officialSources).


  Stocked trout fishery confirmed by agency sources (retrieved 2026-09-14) — TWRA annually stocks
  trout in the reservoir (lake + lake trout named); stocking months unpinned — left unset.


  Regulations: trout 7/day, only 2 may be Lake Trout; largemouth no length limit; smallmouth 15-in
  min; spotted no creel/length; crappie 15/day 10-in; walleye 5/day 18-in (incl. tributaries); white
  bass no harvest; catfish 20/day with 34-in rule; (retrieved 2026-09-14; verify current rules with
  TWRA before you go).
