notes: Rocky Fork and tributaries upstream of the Rocky Fork Road / State Park
  Entrance Road junction (Greene/Unicoi counties). Five trout daily with no
  length limit; single-hook artificial lures only. Use or possession of bait or
  multiple-hook lures is prohibited. One separated single-hook artificial
  dropper lure is permitted. No verified local live gauge is assigned.
