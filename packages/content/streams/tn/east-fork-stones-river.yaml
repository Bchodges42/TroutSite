notes: >-
  The upper East Fork holds a modest wild rainbow population well above the city; TWRA’s stocking
  dataset lists the West Fork and Davidson reaches instead. Rain-flashy plateau headwaters.


  Regulations: Trout — statewide 7/day any combination, no minimum length, no closed season on this
  water (retrieved 2026-09-14; verify current rules with TWRA before you go).


  Owner ruling (2026-09-24): warmwater with a winter/seasonal trout program per
