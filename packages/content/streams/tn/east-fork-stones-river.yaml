  evidenceState: conflicting
  statement: "The catalog's wild-rainbow claim for the upper East Fork could not be verified in any
    agency source: TWRA stocks no row on this reach, and a 2023 EPA survey on the lower East Fork
    found a warmwater assemblage with zero trout. Both sides preserved; the water is unresolved."
  asOf: "2026"
  caveats:
    - TWRA's Stones River stockings are on the WEST Fork greenway (Manson Pike Trailhead, winter
      rainbows) and the J. Percy Priest tailwater (Davidson) - different reaches.
    - Statewide trout rules (7/day, no length limit) apply; no special regulation names this reach.
  unresolvedQuestion: Does the upper East Fork Stones River actually hold a wild rainbow population,
    as the catalog asserts without citation? No agency survey or stocking row addresses this reach.
