notes: >-
  A clear Carter County mountain creek that joins the Watauga at Elizabethton; TWRA stocks upper and lower
  sections in spring. Gentle gradient, easy wading, town access.


  Regulations: Delayed harvest: "Doe River: Roan Mountain State Park boundaries. • Catch-and-release season is
  Oct. 1– Feb 28." General DH rules: harvest/possession prohibited during C&R season, only artificial lures
  permitted, bait prohibited; (retrieved 2026-09-14; verify current rules with TWRA before you go).
