  caveats:
    - "Reach discipline: the forecast node the seed matched (n-y1OLAh) is the WILBUR/Watauga
      tailwater's 2025 biologist report - the Doe River appears there only as the confluence
      landmark dividing the tailwater's lower/upper sections. It is NOT a Doe River assessment; do
      not borrow tailwater conclusions."
    - "The lowermost Elizabethton reach is historically the warm part (prior temperature lead:
      July-Aug gauge samples to ~24.5 C); summer fish presence there is not separately documented."
    - "Same-name risk: the Johnson County Doe Creek is a different water; several claims (and some
      fishing-media content) conflate the two."
