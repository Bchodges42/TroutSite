  evidenceState: documented
  statement: "A documented year-round trout fishery on the Carter County Doe River: TWRA schedules
    spring-summer rainbow stockings (Mar-Jun 2026), a fall delayed-harvest stocking (week of Oct 4),
    and states a catch-and-release season Oct 1 - Feb 28 between the Roan Mountain State Park
    boundaries - a stated fishery component in every season - plus a documented (2017 report) wild
    trout population."
  reachScope: Roan Mountain State Park boundaries reach for the delayed-harvest window; the stocking
    program spans the main stem (upper/lower sections and Valley Forge)
  asOf: "2026"
