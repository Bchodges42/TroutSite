      pinpoint: 5 rows, Region 4, Cocke, 'Trail Fork Big Creek', Seasonal, weeks 2/22, 3/15, 4/5, 4/26,
        5/17/2026, Rainbow Trout (capture captures/twra-schedule.json); GIS points corroborate six
        named stocking locations on the stream
    - label: Brookies in Tennessee get a new, improved home
      url: https://www.tu.org/magazine/conservation/from-the-field/brookies-in-tennessee-get-a-new-improved-home/
      kind: survey
      observationPeriod: rainbow removal before fall 2021 brook trout transfer
      publicationDate: 2021-11-16
      retrieved: 2026-09-22
      pinpoint: TWRA, USFS and UT used electrofishing gear to remove all rainbows from above the falls;
        wild rainbows remained below the waterfall
    - label: Tennessee Trout Management Plan 2017-2027 (Fisheries Report No. 17-10)
      url: https://digitalcommons.memphis.edu/context/govpubs-tn-wra-strategic-management-plans/article/1009/viewcontent/Tennessee_Trout_Management_Plan_2017_2027.pdf
      kind: survey
