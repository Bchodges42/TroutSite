      publicationDate: "2017"
      retrieved: 2026-09-22
      pinpoint: "'Upper Trail Fork currently has a wild Rainbow Trout population, as do some of its
        headwater tributaries (upstream of 2,720')' (prior batch-2 extraction of the plan text)"
  caveats:
    - "Reach boundary preserved: the brook trout reintroduction sits ABOVE the natural waterfall
      barrier; the TWRA put-take rainbow stocking applies to the lower stocked reach - do not merge
      the two stories."
    - Headline is the documented seasonal stocked fishery; the wild-rainbow and brook-reintroduction
      material stays as historical/unresolved supporting claims, never as the visitor-facing
      promise.
    - "Name discipline: TWRA's stocking name is 'Trail Fork Big Creek' (same stocking group as Gulf
      Fork Big Creek in the Bald Mountain headwaters of the Big Creek drainage); 'Big Creek' alone
      is a common name in Cocke County."
    - No gauge, no temperature record, and no post-2025 survey were located for this stream.
