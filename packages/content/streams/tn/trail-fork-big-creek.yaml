opportunity:
  trout: seasonal-stocked-trout
  evidenceState: documented
  statement: TWRA schedules five spring rainbow stockings on lower Trail Fork in 2026. A 2017 plan
    recorded wild rainbows upstream, but Trout Unlimited reports rainbow removal above the waterfall
    before a 2021 brook trout transfer; current upper-reach brook trout persistence is unverified.
  reachScope: Lower TWRA-stocked reach of Trail Fork of Big Creek (Cocke County); above the waterfall
    is the historical rainbow-removal and 2021 brook trout transfer reach, with current occupancy
    unverified.
  asOf: "2026"
  sources:
    - label: TWRA 2026 trout stocking schedule (published plan)
      url: https://www.tn.gov/twra/fishing/trout-information-stockings/_jcr_content/contentFullWidth/tn_complex_datatable_1990410459.exceldriven.json
      kind: schedule-table
      observationPeriod: 2026 stocking schedule
