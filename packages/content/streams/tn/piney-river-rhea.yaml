  statement: "The Rhea County Piney River runs a documented trout cycle: a late-October
    delayed-harvest stocking supports catch-and-release through the winter (season through Feb 28),
    then spring stockings (February-April 2026) carry the fishery - no year-round trout fishery is
    documented on this ungaged river."
