notes: >-
  TVA reservoir on the Holston River northeast of Knoxville across Grainger,
  Hamblen, Hawkins, and Jefferson counties, impounded by Cherokee Dam
  (USGS 03493510 tailwater gauge, 36.16620/-83.49934). Receives the Holston
  River main stem (holston-river); its dam releases the Holston Cherokee
  tailwater that runs to Fort Loudoun Lake. TWRA maps the pool at 27,029 ac;
  TVA at 30,300 ac at full pool.
