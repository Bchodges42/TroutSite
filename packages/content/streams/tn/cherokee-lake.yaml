opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Cherokee Reservoir as a warmwater fishery — largemouth, smallmouth,
    striped and Cherokee' bass, crappie, walleye, saugeye — with summer stratification that leaves
    deep water oxygen-poor; no trout fishery is documented for the lake, and TWRA's trout program on
    this system is the tailwater below the dam.
  reachScope: Cherokee Lake (Cherokee Reservoir) pool — TVA impoundment of the Holston River across
    Grainger/Hamblen/Hawkins/Jefferson counties; excludes the Cherokee Dam tailwater below the dam
    (the stocked trout reach, catalog holston-river)
  asOf: "2026"
  sources:
    - label: TWRA Cherokee Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/cherokee-reservoir.html
      kind: agency-assessment
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: Fishery text names "Largemouth Bass, Smallmouth Bass, Striped Bass, Cherokee' bass,
        Crappie, Walleye, and Saugeye as the primary gamefish species."; stripers "must be
        maintained by stocking" and "do not normally grow big in Cherokee Reservoir, due to low
        summer dissolved oxygen levels and high temperatures." The word "trout" appears nowhere in
        the fishery body (verified 2026-09-22).
  caveats:
    - Warmwater-focus is a documentation statement, not a biological absence claim.
    - The nearest documented trout water is the Cherokee Dam TAILWATER ~20 miles below the dam on
      the Holston River (catalog holston-river, Nov-Apr stocking, 'limited year-round fishing') — it
      is a different water and never transfers to the lake.
    - Even the striped-bass fishery here is documented as DO-limited in summer; the lake is a
      warmwater/coolwater system, not a trout refuge.
