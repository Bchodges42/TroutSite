opportunity:
  trout: year-round-trout
  evidenceState: documented
  statement: "LeConte Creek carries a documented year-round trout opportunity on two reaches: TWRA's
    forecast names it a stocked Gatlinburg stream (rainbows from the West Prong confluence to the
    park boundary, 'Stocking: Year-Round', including a kids' stream section), and the park reach
    above holds wild trout, including NPS-restored brook trout."
  reachScope: "Two reaches: (1) Gatlinburg city reach - WPLP confluence to park boundary, stocked
    rainbows; (2) GSMNP park reach - wild trout"
  asOf: "2026"
  sources:
