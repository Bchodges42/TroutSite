notes: >-
  Small park creek near Gatlinburg with wild fish and TWRA spring stocking listed. Pocket water under heavy
  canopy.


  Regulations: park-wide NPS rules — 5 fish combo, 7 in min, single-hook artificials, no bait, year-round;
  special Gatlinburg permit needed once the creek reaches Gatlinburg city waters (retrieved 2026-09-14; verify
  current rules with TWRA before you go).
