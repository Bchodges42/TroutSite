  caveats:
    - Delayed harvest (catch-and-release) applies to Gatlinburg waters until April 1; the LeConte
      kids' stream section runs from Glenstone Lodge upstream through Mynatt Park to the park
      boundary.
    - A special Gatlinburg permit is required in city waters; the park reach follows NPS rules (5
      fish, 7-in min, single-hook artificials).
    - Wild park streams can also be stocked downstream - the two reaches are managed differently.
