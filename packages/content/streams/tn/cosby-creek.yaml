notes: >-
  Quiet eastern-park option with wild rainbows and brook trout upstream; TWRA stocking rows and GIS
  sites target the lower private-land segments; the park reach is wild. No gauge.


  Regulations: park-wide NPS rules — 5 fish combo, 7 in min, single-hook artificials, no bait,
  year-round (retrieved 2026-09-14; verify current rules with TWRA before you go).


  Correction (2026-09-22, evidence ledger): yearRound false → true — the adjudicated headline is
  year-round-trout on documented reach evidence (GSMNP park reach (year-round wild fishery); TWRA
  stocking rows/GIS sites target lower private-land segments) (ADR 0010 consistency).


  Triage apply (2026-09-24): fishery → 'wild+stocked' (ADR 0011): wild park reach (rainbows + brook
  trout, NPS year-round fishing) + TWRA rows/GIS sites on lower private-land segments
