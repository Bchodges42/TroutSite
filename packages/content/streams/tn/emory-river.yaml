notes: >-
  The Obed’s bigger sibling below the confluence country; wild trout in the upper reaches,
  smallmouth downstream. Plateau flashiness applies. It runs to the Watts Bar embayment head, where
  the pool carries the water down to the Tennessee River.


  Regulations: Emory River special rule — January 1 through April 30, from the Highway 27 Bridge at
  Harriman upstream to the Highway 299 Bridge at Oakdale: one (1) hook having a single point or one
  (1) lure with no more than one (1) single-point hook, max three (3) rods/ ree… (retrieved
  2026-09-14; verify current rules with TWRA before you go).
