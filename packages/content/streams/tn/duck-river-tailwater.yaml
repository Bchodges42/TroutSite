  caveats:
    - "Window vs schedule: the ~8 suitable months are a suitability window; Nov-Jun is the stocking
      season. They are separate claims and must not be merged into 'year-round'."
    - No hydropower turbines at Normandy Dam, but releases above 200 cfs and deep holes still demand
      caution (forecast nodes n-s36nvJ, n-AWNsgh).
    - "Excellent public access: dam and Normandy Town Bridge, hatchery trail, Dement Bridge and 3
      Forks Bridge (renovated by TVA); Cortner Mill is private (node n-I7NFwN)."
