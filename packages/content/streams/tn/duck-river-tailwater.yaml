notes: >-
  Cold releases below Normandy Dam give the Duck its trout identity — TWRA stocks this tailwater
  with rainbow trout year-round (owner confirmation, September 2026). Release-dependent; verify
  schedules before wading.


  Correction (2026-09-22, evidence ledger): yearRound true → false — the adjudicated headline is
  seasonal-stocked-trout; a year-round flag contradicts it (ADR 0010 consistency).
