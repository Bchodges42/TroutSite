  evidenceState: documented
  statement: "A seasonal TWRA stocked rainbow trout fishery: TWRA says the river is suitable for trout
    about 8 months a year, with good catches of 10-14 inch rainbows in the first 9 miles during the
    November-June stocking season - not a year-round trout water."
  reachScope: Duck River below Normandy Dam - good trout catches in the first ~9 miles during the
    stocking season
  asOf: "2026"
  sources:
