  statement: TWRA manages the Obion River as a warmwater crappie/bass river (30-per-day crappie rule
    incl. tributaries) and no trout program or trout record exists for it; the fish fauna is a
    documented warmwater lowland assemblage.
  reachScope: Main stem, northwest Tennessee (documented gaged reaches near Kenton, Rives, and at Hwy
    51 near Obion)
