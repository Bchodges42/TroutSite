  caveats:
    - Channelized bottomland river through Obion/Dyer/Lake counties - a warmwater fishery, never a
      trout water on current evidence.
    - TWRA's nearest trout stocking is the Union City Reelfoot Packing Site (winter program, Obion
      County) - a pond-type site, not the river.
