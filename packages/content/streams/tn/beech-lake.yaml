  caveats:
    - "Winter program design: TWRA's Trout Management Plan (Winter Trout Program section, verified
      first-hand this pass) says the program 'provides trout angling opportunity during the winter
      months' and describes hatchery-supported lakes as primarily warmwater habitats that cannot
      support trout year round; do not expect a documented summer trout fishery, but absence after
      winter is not biologically proven either."
    - Underlying fishery is warmwater (bass/bream-type lake per program context); a positive
      warmwater assemblage document was not verified for this lake this pass.
    - Daily creel is 7 trout statewide (5 at Community Lakes Fishing Program locations); a trout
      license is needed in addition to the fishing license.
