notes: >-
  One main-stem river shown in both East and West Tennessee, not a pair of east/west duplicates.
  Within Tennessee the main stem has two natural reaches: the AL line at Shellmound (Tennessee River
  mile 424) upstream through Nickajack, Chickamauga, Watts Bar, and Fort Loudoun pools to the
  Holston/French Broad confluence at Knoxville, and the West Tennessee reach from Pickwick Lake to
  the Kentucky line — the river legitimately leaves the state between mile 424 and Pickwick. Warm
  main-stem water — the trout fishing lives in the cold tailwaters below the dams, and the moving
  reaches are smallmouth water.


  Regulations: Sauger 10/day, 15-in min; Walleye 5/day, 16-in min; black bass 5/day combined — 15-in
  min largemouth/smallmouth, no length limit spotted; crappie 20/day, 10-in min
  (reservoir-specific); catfish no limit under 34 in, only 1 over 34 in/day; (retrieved 2026-09-14;
  verify current rules with TWRA before you go).
