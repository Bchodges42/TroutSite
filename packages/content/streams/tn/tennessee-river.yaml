notes: >-
  One main-stem river shown in both East and West Tennessee, not a pair of east/west duplicates. Within
  Tennessee the main stem has two natural reaches: the AL line at Shellmound (Tennessee River mile 424)
  upstream through Nickajack, Chickamauga, Watts Bar, and Fort Loudoun pools to the Holston/French Broad
  confluence at Knoxville, and the West Tennessee reach from Pickwick Lake to the Kentucky line — the
  river legitimately leaves the state between mile 424 and Pickwick. Warm main-stem water — the trout
  fishing lives in the cold tailwaters below the dams, and the moving reaches are smallmouth water.

