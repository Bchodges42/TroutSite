opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Melton Hill as a 'cool water' reservoir whose cold Norris Dam inflow
    suppresses bass and bluegill while keeping summer dissolved oxygen good — a documented warmwater
    fishery (black bass, striped bass, musky, crappie) with no lake trout program and no documented
    lake trout fishery.
  reachScope: Melton Hill Lake pool — Clinch River impounded by Melton Hill Dam (Clinch River mile
    23.1), Anderson/Roane counties, from the dam upstream ~38 miles toward Clinton; excludes the
    Clinch River Norris tailwater catalog entry upstream of Hwy 61
  asOf: "2026"
  sources:
    - label: TWRA Melton Hill Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/melton-hill-reservoir.html
      kind: agency-assessment
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: '"Melton Hill is a cool water reservoir with relatively low productivity."; "The cold
        water released through Norris Dam negatively impacts warm water fish species like Largemouth
        Bass and Bluegill" (causing slow growth and limited reproduction); "The cool flowing water,
        however, guarantees that dissolved oxygen levels remain good throughout the summer for
        Smallmouth Bass, Striped Bass, and Musky." "What you can catch" headings: Black Bass,
        Striped Bass, Musky, Crappie. Verified live 2026-09-22.'
  caveats:
    - Warmwater-focus is a documentation statement, not a biological absence claim — this pool IS
      the continuation of a famous trout tailwater, and cold inflow is documented.
    - The documented Clinch trout water (catalog clinch-river) ends at the Hwy 61 Bridge at Clinton
      upstream; TWRA's tailwater assessment never describes this pool.
    - TWRA frames the cold inflow as a negative for the lake's documented fishery (slow bass growth,
      limited bluegill reproduction) — the reservoir is managed and described as a
      coolwater/warmwater fishery, not a trout fishery.
