notes: >-
  TVA reservoir on the Clinch River between Norris Dam and Watts Bar Lake
  (Anderson/Roane counties near Oak Ridge), impounded by Melton Hill Dam
  (USGS 03535912 tailwater gauge, 35.88536/-84.30076; Clinch River mile 23.1).
  The Norris tailwater (clinch-river) runs the length of this pool, giving
  year-round cold-water fishing; the dam discharges into the Clinch arm of
  Watts Bar Lake. TWRA maps the reservoir at 6,035 ac.
  TWRA's Melton Hill Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
