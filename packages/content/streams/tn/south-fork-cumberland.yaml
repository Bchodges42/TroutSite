opportunity:
  trout: unresolved
  evidenceState: conflicting
  statement: "Trout are documented in the Big South Fork watershed (rainbow and brown in NPS fish
    lists), but main-stem presence is NOT established: the NPS places browns in park tributaries
    rather than the main river, the only naturally-reproducing designation in the sub-basin belongs
    to Laurel Fork (a tributary), and no stocking row exists. Unresolved - both sides preserved."
  reachScope: Big South Fork main stem, Scott County (Leatherwood Ford reach context)
  asOf: "2026"
  caveats:
    - NPS rules follow TWRA (TN) and KDFWR (KY) regulations on this water.
    - Beautiful and isolated water - plan bail-outs; no gauge temperature record exists at
      Leatherwood Ford.
    - Do not confuse with the Kentucky tailwater Cumberland River below Lake Cumberland - a
      different water.
  unresolvedQuestion: Does the cataloged Tennessee main stem itself hold trout (wild or stocked), as
    opposed to its tributaries? No main-stem survey, stocking row, or temperature record was found.
