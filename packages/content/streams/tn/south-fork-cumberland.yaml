notes: >-
  Big South Fork National River & Recreation Area water with wild browns and rainbows around
  Leatherwood Ford. Beautiful and isolated — plan bail-outs. The Tennessee reach runs from the New
  River/Clear Fork confluence country up to the Kentucky line.


  Regulations: NPS: "follows the same rules and regulations set forth by the Tennessee Wildlife
  Resources Agency and the Kentucky Department of Fish and Wildlife Resources"; (retrieved
  2026-09-14; verify current rules with TWRA before you go).
