notes: >-
  Big South Fork National River & Recreation Area water with wild browns and rainbows around Leatherwood
  Ford. Beautiful and isolated — plan bail-outs. The Tennessee reach runs from the New River/Clear Fork
  confluence country up to the Kentucky line.

