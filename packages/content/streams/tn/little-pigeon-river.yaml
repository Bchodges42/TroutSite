  statement: TWRA documents this Sevierville-corridor river as a quality smallmouth fishery (1/day,
    20-inch minimum from the mouth to the park boundary, including the prongs); a TWRA
    trout-stocking row for the Sevierville main stem could NOT be verified - the owner-reported
    stocking program remains unconfirmed.
  reachScope: Main stem, GSMNP boundary downstream through Pigeon Forge/Sevierville to the Douglas Lake head
