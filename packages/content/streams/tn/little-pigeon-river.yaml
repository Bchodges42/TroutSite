  caveats:
    - Smallmouth 1/day, 20-in minimum mouth-to-park-boundary (incl. West Prong and East Fork);
      statewide rules otherwise.
    - The prong stockings (Mid Prong; W Prong at Pigeon Forge) are sibling catalog waters - their
      schedule rows do not join this main stem.
    - If the main-stem stocking is ever confirmed by a row or agency statement, the water likely
      becomes mixed; today the documented evidence is warmwater management only.
