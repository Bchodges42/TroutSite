notes: >-
  A consistent trout water below the Smokies — TWRA stocks the Sevierville reach TWRA's statewide
  regulation exceptions carry a smallmouth/black bass rule for this river. (see officialSources).
  regularly (confirmed by the owner against local knowledge, September 2026, supplementing the TWRA
  dataset, which does not list the reach), and the upper park reaches hold wild fish. Verify current
  schedules with TWRA before you go.


  Regulations: Smallmouth bass 1/day, 20-in minimum (mouth upstream to GSMNP boundary, incl. West
  Prong and East Fork); statewide rules otherwise (black bass 5/day combo, crappie 15 @ 10 in,
  catfish 34-in rule) (retrieved 2026-09-14; verify current rules with TWRA before you go).


  Owner ruling (2026-09-24): wild trout present + weekly Gatlinburg-program stocking per
  OWNER-RULINGS-2026-09-24.md ruling 3; fishery wild+stocked (ADR 0011).
