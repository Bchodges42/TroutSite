        (captures/twra-recent-releases.json)"
  caveats:
    - "Species distinction preserved: browns = documented multi-year persistence/trophy component;
      rainbows = largely fall-winter stocked put-take with little multi-year holdover (TWRA 2026
      survey)."
    - "Reach boundary: trout are '24-7-365' only in the first ~11 miles; Old Dam Ford (a few miles
      below Farris Creek) is winter-only, and the river transitions to smallmouth water below - the
      year-round claim never extends to the lower Elk (elk-river-lower)."
    - Only two public access points on the year-round reach (Hwy 50 Bridge, Farris Creek Bridge, ~9
      miles apart); float dam-to-Farris Creek takes a full day (node n-yxFIZJ).
    - Generation swings from Tims Ford Dam require the TVA schedule (node n-oNtwQp).
