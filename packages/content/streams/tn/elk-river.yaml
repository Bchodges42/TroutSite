opportunity:
  trout: year-round-trout
  evidenceState: documented
  statement: TWRA documents trout available '24-7-365' in the first 11 miles below Tims Ford Dam, with
    a Mar-Dec rainbow/brown stocking program - browns persisting in multiple year classes while
    rainbows are largely annual put-take fish.
  reachScope: First ~11 miles of Elk River below Tims Ford Dam (Hwy 50 Bridge to about Farris Creek;
    Old Dam Ford, a few miles below Farris Creek, holds trout only in winter). Does NOT extend to
    the whole Elk River.
  asOf: "2026"
  sources:
