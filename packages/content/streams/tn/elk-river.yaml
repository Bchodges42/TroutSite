notes: >-
  A compact, cold Tims Ford release with put-grow-take rainbows stocked March through December and
  winter stocking in the lower county reaches — a quiet Middle TN favorite. Two gauges (below dam
  and near Pelham) bracket the fishery.


  Regulations: Tims Ford Dam to I-65 bridge (incl. tributaries): Brown Trout 20-in minimum, 1/day;
  total creel all trout species combined 7 (retrieved 2026-09-14; verify current rules with TWRA
  before you go).
