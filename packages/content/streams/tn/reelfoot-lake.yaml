notes: >-
  Shallow natural oxbow lake formed by the 1811-12 New Madrid earthquakes (Obion County, West Tennessee).
  Tennessee's premier crappie and bluegill water, with a cypress-tree shoreline best fished by boat; check
  TWRA guides for the commercial fishing and boating rules that apply on this lake.


  Regulations: LMB 5/day 15-in; spotted bass no length limit; crappie 20/day combo 10-in (regulatory table —
  page narrative separately says 30/day; internal discrepancy noted, see DISPUTES); catfish 34-in rule;
  paddlefish 2/day Apr 24–May 31; (retrieved 2026-09-14; verify current rules with TWRA before you go).
