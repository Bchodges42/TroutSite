notes: >-
  Shallow natural oxbow lake formed by the 1811-12 New Madrid earthquakes (Obion County, West
  Tennessee). NHD's main-basin waterbody carries the historic gnis_name "Reading House Slough";
  the product identity is the lake basin promoted from the passive lake source to an
  authoritative NHD polygon with a catalog record. Source NHDPlusIDs are recorded on the
  delivered feature and in docs/audits/WEST-MIDDLE-HYDROGRAPHY.md.
