id: reelfoot-lake
name: Reelfoot Lake
stateId: TN
waterbodyType: lake
regionId: tn-west
gaugeIds: []
stockingProgram: false
idealFlow: []
targetSpecies:
  - crappie
  - bluegill
notes: >-
  Shallow natural oxbow lake formed by the 1811-12 New Madrid earthquakes (Obion County, West
  Tennessee). Tennessee's premier crappie and bluegill water, with a cypress-tree shoreline
  best fished by boat; check TWRA guides for the commercial fishing and boating rules that
  apply on this lake.
