notes: >-
  Tremont’s classic pocket water — wild rainbows and brook trout, TWRA spring stocking noted by TWRA
  on the Middle Prong. No gauge; recent-rain judgment applies.


  Regulations: park-wide NPS rules — 5 fish combo, 7 in min, single-hook artificials, no bait,
  year-round (retrieved 2026-09-14; verify current rules with TWRA before you go).


  Correction (2026-09-22, evidence ledger): yearRound false → true — the adjudicated headline is
  year-round-trout on documented reach evidence (GSMNP park reach (Tremont drainage, including the
  Lynn Camp Prong watershed)) (ADR 0010 consistency).


  Triage apply (2026-09-24): fishery → 'wild+stocked' (ADR 0011): wild park reach (NPS; stocking
  ended park-wide in 1975) + TWRA rows stocking sites outside the park
