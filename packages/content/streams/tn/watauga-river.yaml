      pinpoint: "node n-agReBt: \"The coldwater releases from the Wilbur Dam provide the perfect
        environment for year-round angling opportunities.\" and \"Along with the South Holston, the
        Watauga is one of Tennessee's two tailwaters that has an entirely wild population of Brown
        Trout.\" Capture: captures/twra-forecast-text.md; verified live 2026-09-22."
    - label: TWRA published trout stocking schedule (2026) + recently stocked report
      url: https://www.tn.gov/twra/fishing/trout-information-stockings/_jcr_content/contentFullWidth/tn_complex_datatable_1990410459.exceldriven.json
      kind: schedule-table
      observationPeriod: 2026 schedule; completed release 2026-09-03
      retrieved: 2026-09-22
      pinpoint: 'Schedule row: REGION 4, Carter/Washington, "Wilbur Tailwater / Watauga River", Tailwater,
        STOCKING MONTHS "M, A, M, J, J, A, S", SPECIES "Rainbow Trout". Recent-release row: {Region
        4, Destination "Wilbur TW", Stocking Date 09/03/2026}. Both verified live 2026-09-22.'
  caveats:
    - Latest agency sampling is March 2025 (2026 survey cancelled for low flows) — the fishery
      assessment is current TWRA text, but fish-population numbers are as-of 2025.
    - Brown trout here are entirely wild (TWRA); rainbow fishing is substantially
      put-and-take/put-grow-take on March-September stocking.
    - Flow is TVA-driven from Wilbur Dam; wade windows open when releases stop — check the TVA
      Wilbur Dam schedule.
