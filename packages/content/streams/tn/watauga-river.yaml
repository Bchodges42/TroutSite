notes: >-
  Cold, green tailwater below Wilbur Dam famous for sulphur and caddis hatches, trophy rainbow
  management, and long drift-boat runs toward Elizabethton. Wade windows open when TVA drops releases;
  two gauges bracket the dam and town. It runs from Wilbur Dam down to the Boone Lake Watauga-arm head.

