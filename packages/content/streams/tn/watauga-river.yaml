notes: >-
  Cold, green tailwater below Wilbur Dam famous for sulphur and caddis hatches, trophy rainbow
  management, and long drift-boat runs toward Elizabethton. Wade windows open when TVA drops
  releases; two gauges bracket the dam and town. It runs from Wilbur Dam down to the Boone Lake
  Watauga-arm head.


  Regulations: Statewide 7-trout creel except the Quality Trout Fishing Area, Smallings bridge
  downstream to CSX railroad bridges: 14-in minimum, 2-trout creel, bait prohibited, trout less than
  14 in may not be possessed (retrieved 2026-09-14; verify current rules with TWRA before you go).
