  evidenceState: documented
  statement: TWRA's 2026 forecast describes the Watauga River below Wilbur Dam as one of the
    Southeast's premier tailwaters with coldwater releases providing year-round angling, an entirely
    wild brown-trout population, and stocked rainbows — 2025 sampling found ongoing natural
    reproduction of both species.
  reachScope: Watauga River below Wilbur Dam (Wilbur Tailwater), Carter County downstream ~16 miles
    toward the Boone Lake Watauga-arm head; Quality Trout Fishing Area from Smallings Bridge to the
    CSX railroad bridges
  asOf: "2026"
  sources:
    - label: TWRA Trout Fishing Forecast StoryMap (2026 edition), Wilbur Tailwater section
      url: https://www.arcgis.com/sharing/rest/content/items/dbb92bdf718f4fd7839bf4b08fb82747/data?f=json
      kind: agency-assessment
      observationPeriod: 2026 forecast edition
