opportunity:
  trout: unresolved
  evidenceState: unresolved
  statement: "No documented trout fishery exists for the Prospect-to-state-line Elk: the year-round
    tailwater water ends ~11 miles below Tims Ford Dam far upstream, no stocking row targets this
    mainstem, and the nearest upstream gauge shows warm summer water - but absence is not provable,
    so the trout question stays honestly unresolved."
  reachScope: Elk River mainstem from Prospect to the Tennessee-Alabama state line (Lincoln County).
  asOf: "2026"
  caveats:
    - The year-round trout reach TWRA documents ('24-7-365', first 11 miles) is far upstream below
      Tims Ford Dam (elk-river); TWRA's forecast explicitly ends the story at Old Dam Ford
      (winter-only) before the river becomes smallmouth water.
    - USGS 03582000 (Elk River above Fayetteville) is UPSTREAM context for this reach, not a point
      measurement of it - never quote it as the reach's temperature.
    - Old Dam Ford - the one winter-trout point TWRA maps in Lincoln County - sits ~12 miles below
      the dam, well upstream of Prospect; it belongs to the tailwater story, not this reach.
    - Warmwater likelihood (smallmouth transition water) is supported only by semi-authoritative
      tourism description and shared Fishbrain aggregates - research leads, not citable claims - so
      warmwater-focus is NOT asserted.
  unresolvedQuestion: Does any trout opportunity (stocked margin, winter event, or residual fish)
    exist on the Elk River mainstem from Prospect to the state line? No stocking row, no
    reach-specific assessment, and warm upstream summer temperatures argue against a fishery, but
    absence is not provable - unresolved.
