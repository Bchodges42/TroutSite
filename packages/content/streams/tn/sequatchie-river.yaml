notes: >-
  TWRA spring-stocks the Sequatchie Valley headwaters in Cumberland County. The Whitwell gauge sits far
  downstream — treat it as a valley-level trend, not the headwater truth. It runs the full valley from
  the Cumberland County headwaters down toward the Tennessee River at Shellmound.

