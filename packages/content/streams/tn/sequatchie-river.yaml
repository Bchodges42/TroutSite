notes: >-
  TWRA spring-stocks the Sequatchie Valley headwaters in Cumberland County. The Whitwell gauge sits
  far downstream — treat it as a valley-level trend, not the headwater truth. It runs the full
  valley from the Cumberland County headwaters down toward the Tennessee River at Shellmound.


  Regulations: not among the special-regulation waters listed on TWRA's trout or statewide pages, so
  statewide limits apply: trout 7/day no minimum length (if any are present); 5 black bass/day any
  combination, no minimum length; rock bass 20/day; (retrieved 2026-09-14; verify current rules with
  TWRA before you go).
