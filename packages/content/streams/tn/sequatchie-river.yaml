  caveats:
    - "2026 stocking weeks: March 22, March 29 and May 17 - fish the headwaters soon after releases."
    - No headwater summer-temperature data, holdover, or wild-trout evidence exists; the lower
      river's 1960s July maxima ran 24-26 C.
    - TWRA's documented fish for the river outside the trout program is warmwater (sickle darter
      records; bass/catfish dominate community reports) - the trout fishery is the spring
      put-and-take.
