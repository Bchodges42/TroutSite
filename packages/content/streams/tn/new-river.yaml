  statement: "No acceptable positive evidence documents the fishery of this Scott County New River:
    the smallmouth reputation comes from tourism/app sources, no agency assemblage survey was found,
    and no trout record exists. Unresolved - absence of trout records never establishes a
    warmwater-only fishery."
  asOf: "2026"
  caveats:
    - "Same-name hazard: the West Virginia New River dominates search results - identity discipline
      required."
    - No TWRA trout program, wild-trout listing, or special regulation exists for this river;
      absence of trout records does NOT mean 'no trout'.
  unresolvedQuestion: Is there positive dated evidence (agency assemblage survey, TWRA management
