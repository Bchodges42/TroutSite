notes: >-
  Wild-river sandstone gorge country in the Obed Wild & Scenic River corridor — self-sustaining
  rainbow, brown, and brook trout in clean riffles. Flashy plateau watershed: rises fast, drops fast.
  Stocking flag false by design — verify NPS/TWRA notices. It runs its full named length across the
  Cumberland Plateau to the Emory confluence.

