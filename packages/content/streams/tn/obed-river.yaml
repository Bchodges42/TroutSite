notes: >-
  Wild-river sandstone gorge country in the Obed Wild & Scenic River corridor — self-sustaining
  rainbow, brown, and brook trout in clean riffles. Flashy plateau watershed: rises fast, drops fast.
  Stocking flag false by design — verify NPS/TWRA notices. It runs its full named length across the
  Cumberland Plateau to the Emory confluence. USGS 03538830 is an upstream Obed reach about 20
  river miles above the Emory junction, so its conditions are representative context rather than
  a point measurement for every mapped access area.

  Wild-trout presence is reported locally but remains unverified by agency sources as of 2026-09-14; confirm with TWRA Regions 3/4.
