notes: >-
  Wild-river sandstone gorge country in the Obed Wild & Scenic River corridor — a plateau smallmouth and rock
  bass river. Flashy plateau watershed: rises fast, drops fast. Stocking flag false by design — verify
  NPS/TWRA notices. It runs its full named length across the Cumberland Plateau to the Emory confluence. USGS
  03538830 is an upstream Obed reach about 20 river miles above the Emory junction, so its conditions are
  representative context rather than a point measurement for every mapped access area.


  Correction (2026-09-15): agency sources document a warmwater fishery with no trout program or record — NPS
  Obed WSR documents a warmwater fishery (smallmouth/rock bass); no trout program or record; agency temps
  reached 29.7 °C in Jul 2026. (retrieved 2026-09-14).
