notes: >-
  Tennessee River impoundment from Nickajack Dam (USGS 03570525 tailwater gauge) upstream 46 miles
  through Chattanooga to Chickamauga Dam (Marion/Hamilton counties). Downstream of Chickamauga Lake;
  below the dam the main stem continues toward Guntersville Lake in Alabama as tennessee-river. TVA
  lists the reservoir at about 10,700 acres — a scenic gorge reach below the dam and a wide, urban
  Chattanooga reach above it. Verify TVA release schedules before paddling the gorge.
  TWRA's Nickajack Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).

