notes: >-
  Tennessee River impoundment from Nickajack Dam (USGS 03570525 tailwater gauge, 35.00258/-85.62108)
  upstream 46 miles through Chattanooga to Chickamauga Dam (Marion/Hamilton counties). Downstream of
  Chickamauga Lake; discharges at the dam toward Guntersville Lake in Alabama (the main stem continues
  as tennessee-river). 0 km²) and models the Chattanooga reach as river area. Cross-checks: NHD 01295741
  and TVA published size (10,700 ac). Verified geometry (geo/east-fix rebuild): TWRA RiversReservoirs
  tn_reservoirs (OBJECTID 36, the Tennessee waterways source) remains the identity — NHDPlus HR carries
  only the western gorge as the named pool. Assembly fixed: the source multipart's two real pool
  polygons (Chattanooga reach + gorge, 45.6 km² total) are kept whole and its micro-sliver fragments (<
  0.5 km²) are dropped; the earlier 20-fragment delivery was the same source feature assembled part-by-
  part.

