notes: >-
  Small reservoir on the Little Tennessee River along the North Carolina line
  in Blount County, impounded by Calderwood Dam. Receives Little Tennessee
  flow from Fontana Lake (NC) and discharges into Chilhowee Lake. TWRA stocks the
  reservoir with rainbow trout in November and December. TWRA lists
  this pool as "Little Calderwood Reservoir" (458 ac) — that name is an alias
  here.
