  - bluegill
  - channel-catfish
notes: >-
  TVA impoundment of the Caney Fork and Collins River above Great Falls Dam at Rock Island
  (Warren/White county line), immediately upstream of Center Hill Lake. The caney-fork-upper
  catalog reach passes through this pool, so paddlers and anglers can follow the water
  through the impoundment.
  TWRA's Great Falls Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish (see officialSources).
