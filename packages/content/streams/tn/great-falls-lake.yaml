notes: >-
  TVA impoundment of the Caney Fork and Collins River above Great Falls Dam at Rock Island
  (Warren/White county line), immediately upstream of Center Hill Lake. The caney-fork-river
  catalog reach passes through this pool; promoted from the passive lake source so the visible
  water is identified and selectable.
