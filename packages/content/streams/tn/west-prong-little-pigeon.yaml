      retrieved: 2026-09-22
      pinpoint: Wild brook/rainbow/brown trout park-wide at 2,000-4,000 fish per mile in many streams;
        'Fishing is permitted year-round in open waters'; non-native stocking ended 1975; special
        permits required for Gatlinburg waters
    - label: TWRA trout forecast StoryMap - Gatlinburg waters block
