notes: >-
  Wild rainbow and brook trout water in the park’s Chimneys/Tremont corridor, with TWRA spring
  stocking on lower reaches. Steep, flashy watershed — check the gauge before committing.


  Regulations: park-wide NPS rules — 5 fish combo, 7 in min, single-hook artificials, no bait,
  year-round; special permit required for Gatlinburg city waters at the park boundary (retrieved
  2026-09-14; verify current rules with TWRA before you go).
