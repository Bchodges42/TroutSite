  caveats:
    - "Park reach: wild rainbows and brook trout, year-round, NPS rules (artificials only); no
      stocking since 1975."
    - "Gatlinburg reach (park boundary to Gnatty Branch): stocked year-round by the city program;
      catch-and-release Dec 1-Mar 31; Gatlinburg permit required year-round; Thursday is
      stocking/closure day."
    - The Spur between Gatlinburg and Pigeon Forge is not stocked in July-September heat (reduced
      numbers Aug-Sep) - do not promise midsummer limits on that segment.
