      retrieved: 2026-09-22
      pinpoint: "n-ZH7DtI: Gatlinburg stocks the WPLP ~5 miles to Gnatty Branch; n-nB5U6I 'Stocking:
        Year-Round'; n-ONYvQy: the Spur is not stocked July-September (reduced numbers Aug-Sep);
        n-xfcoID: Dec 1-Mar 31 catch-and-release; n-NtmGZT: Apr 1-Nov 30 general streams 5/day;
