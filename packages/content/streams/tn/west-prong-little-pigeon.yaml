opportunity:
  trout: year-round-trout
  evidenceState: documented
  statement: "The West Prong Little Pigeon offers documented year-round trout fishing: wild rainbow
    and brook trout in the national park reach, and TWRA's forecast documents a year-round stocked
    fishery through Gatlinburg (delayed harvest Dec 1-Mar 31, permit required), with the Spur reach
    between Gatlinburg and Pigeon Forge unstocked in the July-September heat."
  reachScope: park reach above Gatlinburg (wild) and the Gatlinburg stocked reach (park boundary to
    Gnatty Branch); the Spur reach pauses stockings in midsummer
  asOf: "2026"
  sources:
