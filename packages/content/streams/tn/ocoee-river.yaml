opportunity:
  trout: unresolved
  evidenceState: unresolved
  statement: "No trout opportunity is documented for the upper Ocoee (Copperhill/Ocoee No. 3 reach):
    the only Ocoee-named TWRA stocking binds to the Parksville tailwater below Ocoee Dam No. 1, a
    different reach, and no agency survey or dated trout observation covers this reach."
  asOf: "2026"
  caveats:
    - The Parksville tailwater stocking (Mar-May rainbows) is a different catalog water and must not
      be transferred to this reach.
    - TVA's tunnel diversion at Ocoee Dam No. 3 makes flow release-dependent; no temperature record
      exists for the reach.
    - Fishbrain trout counts on the shared 'Ocoee River' page cannot be attributed to this reach.
  unresolvedQuestion: "Is there any trout opportunity (stocked or wild) on the upper Ocoee
    Copperhill/Ocoee No. 3 reach? No reach-specific survey, stocking record, or dated observation
    was found; next source: Cherokee National Forest (USFS) fisheries survey of the Ocoee above Dam
    No. 1, or TWRA Coldwater Summit materials."
