id: ocoee-river
name: Ocoee River (upper, Copperhill reach)
stateId: TN
waterbodyType: river
regionId: tn-se-hiwassee
gaugeIds:
  - "03559500"
  - "tva:OCBT1"
stockingProgram: false
idealFlow:
  - min: 800
    max: 3000
    unit: cfs
notes: >-
  TVA’s flume-and-recreation river; the Copperhill reach above Parksville Lake runs cold in spring.
  TWRA’s stocking dataset lists Parksville Lake itself rather than this reach — set conservatively.
  Verify TVA release schedules before planning. It runs from Copperhill through Ocoee Number Three
  Lake and the No. 3/No. 2 gorge to the Parksville Lake head.

