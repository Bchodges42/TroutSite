notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Tennessee River
  reservoir at Pickwick Landing in Hardin County; distinct from Kentucky Lake, whose
  polygon ends well to the north. Detailed angler notes are still being prepared —
  check TWRA and local access areas in the meantime.
  TWRA's Pickwick Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
  Striped bass is a regulatory or hybrid-evidence tag here; reservoir temperature/oxygen refuge context is not a scored input.
