notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Tennessee River reservoir at
  Pickwick Landing in Hardin County; distinct from Kentucky Lake, whose polygon ends well to the
  north. Detailed angler notes are still being prepared — check TWRA and local access areas in the
  meantime. TWRA's Pickwick Reservoir page lists the fishery as largemouth bass, smallmouth bass,
  spotted bass, crappie, bluegill, catfish, striped bass (see officialSources). Striped bass is a
  regulatory or hybrid-evidence tag here; reservoir temperature/oxygen refuge context is not a
  scored input.


  Regulations: black bass 5/day combo 15-in (spotted no length); crappie 30/day combo 9-in;
  striped/hybrid 2/day 15-in; white bass 15/day; walleye 5/day 16-in; sauger 10/day 15-in;
  paddlefish 2/day Apr 24–May 31, no culling; (retrieved 2026-09-14; verify current rules with TWRA
  before you go).
