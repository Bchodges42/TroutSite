  statement: TWRA's 2026 forecast describes the Fort Patrick Henry Tailwater as a short urban
    tailwater producing some of the state's largest holdover rainbow trout, labeled year-round
    fishing and confirmed by March 2026 electrofishing — though overall catch rates are at their
    lowest since monitoring began trending in 2017.
  reachScope: South Fork Holston River below Fort Patrick Henry Dam (Fort Patrick Henry Tailwater),
    Sullivan County — dam downstream to the Kingsport confluence; public angling concentrated Hwy 36
    to the Wesley Road corridor boat ramp
  asOf: "2026"
