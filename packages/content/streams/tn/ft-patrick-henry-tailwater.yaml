notes: >-
  Compact urban tailwater below Fort Patrick Henry Dam with a reliable cold release and TWRA-stocked
  rainbow and brown trout. Wadeable at low generation; rises quickly. Verified geometry (geo/east-fix
  rebuild): NHDPlus HR NHDFlowline GNIS South Fork Holston River from Fort Patrick Henry Dam (USGS
  03487010) to the Kingsport confluence; single welded chain.

