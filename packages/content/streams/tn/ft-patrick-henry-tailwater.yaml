id: ft-patrick-henry-tailwater
name: Fort Patrick Henry Tailwater (South Fork Holston River)
stateId: TN
waterbodyType: tailrace
display: featured
regionId: tn-east-holston
gaugeIds:
  - "tva:FPHT1"
stockingProgram: true
species: trout
fishery: tailwater
yearRound: true
idealFlow:
  - min: 100
    max: 800
    unit: cfs
idealFlowSource: editorial
seasonMonths: [3, 4 ]
seasonKind: programmatic
notes: >-
  Compact urban tailwater below Fort Patrick Henry Dam with a reliable cold release and TWRA-stocked
  rainbow and brown trout. Wadeable at low generation; rises quickly. It runs from the dam to the
  Kingsport confluence, where the Holston main stem forms.

