notes: >-
  Compact urban tailwater below Fort Patrick Henry Dam with a reliable cold release and TWRA-stocked
  rainbow and brown trout. Wadeable at low generation; rises quickly. It runs from the dam to the
  Kingsport confluence, where the Holston main stem forms.


  Regulations: "Boone Dam downstream to Louis Milhorn Bridge on Beulah Church Drive": 16–22 in PLR
  for rainbow and brown; 7-trout creel (all species combined), only 1 over 22 in (TWRA Fort Patrick
  Henry where-to-fish page repeats this rule verbatim) (retrieved 2026-09-14; verify current rules
  with TWRA before you go).
