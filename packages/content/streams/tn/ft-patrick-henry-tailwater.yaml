  caveats:
    - Abundance is in a documented multi-year decline (lowest catch rates since the trend began in
      2017, per TWRA March 2026 sampling) even though trophy-size fish remain common.
    - "Extremely dangerous flow swings: the river rises almost immediately when generators come on —
      check the TVA Fort Patrick Henry Dam schedule."
    - Stocking months are a documented conflict between current TWRA sources (Mar/Apr vs
      Mar/Apr/Dec, with a September 2026 completed release).
