  caveats:
    - Seasonal program (March-July) — TWRA does not claim a year-round fishery here; Wilbur is
      absent from TWRA's live year-round reservoir trout list even though the older statewide
      management plan counted it among nine reservoir trout fisheries (documentation drift worth
      reviewer attention).
    - "SIBLING TRAP (audit hard case): this verdict is the ~72-acre POOL. The Wilbur TAILWATER below
      Wilbur Dam (catalog watauga-river) has the year-round wild-brown verdict; the riverine reach
      above the pool is watauga-river-wilbur-reach. The 'Wilbur Tailwater / Watauga River' schedule
      row belongs to the river — never join it to this lake."
    - No agency holdover, survey, or temperature record specific to the reservoir was verified this
      pass.
