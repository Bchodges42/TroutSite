  statement: TWRA's live stocking table documents a rainbow trout program for Wilbur Reservoir from
    March through July under statewide regulations — a seasonal stocked fishery on a small, cold,
    dam-fed pool; it is not on TWRA's year-round reservoir trout list and no year-round fishery is
    documented.
