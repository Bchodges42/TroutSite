notes: >-
  Small (~72 acre) TVA regulating pond between Watauga Dam and Wilbur Dam on
  the Watauga River in Carter County. Receives Watauga Dam releases via the
  short riverine reach (watauga-river-wilbur-reach) and discharges through
  Wilbur Dam (USGS 03484000, 36.34411/-82.12956) into the Watauga River
  (Wilbur tailwater). Also shown on TWRA's waterways map (72 ac).
