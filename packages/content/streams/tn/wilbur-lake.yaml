notes: >-
  Small (~72 acre) TVA regulating pond between Watauga Dam and Wilbur Dam on the Watauga River in
  Carter County. Receives Watauga Dam releases via the short riverine reach
  (watauga-river-wilbur-reach) and discharges through Wilbur Dam (USGS 03484000, 36.34411/-82.12956)
  into the Watauga River (Wilbur tailwater). Also shown on TWRA's waterways map (72 ac).


  Stocked trout fishery documented by agency sources in the 2026-09 wave-ledger sourcing pass
  (retrieved 2026-09-14) — TMP trout reservoir; "Watauga Dam, Wilbur Reservoir — Rainbow — March
  through July" schedule row (wave-1 dispute resolved).


  Regulations: Statewide Regulations per the schedule row — 7 trout/day any combination, no minimum
  length limit, only 2 may be Lake Trout (retrieved 2026-09-14; verify current rules with TWRA
  before you go).
