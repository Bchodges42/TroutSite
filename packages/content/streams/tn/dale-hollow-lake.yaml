notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Obey River
  reservoir at the Kentucky line in Clay, Pickett, and Overton counties. TWRA stocks brown
  trout here each spring (put-grow-take). Detailed
  angler notes are still being prepared — check TWRA and local access areas in the
  meantime.
  TWRA's Dale Hollow Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish (see officialSources).
