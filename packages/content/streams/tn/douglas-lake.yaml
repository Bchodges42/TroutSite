notes: >-
  TVA reservoir on the French Broad River east of Knoxville across Cocke,
  Jefferson, Sevier, and Hamblen counties, impounded by Douglas Dam (USGS
  03468510 tailwater gauge, 35.96120/-83.53878). Receives the French Broad
  River and the Pigeon River; discharges through the dam into the French Broad
  tailwater toward the Holston/French Broad confluence. TWRA maps the
  reservoir at 28,738 ac. Aliases: Douglas Reservoir.
