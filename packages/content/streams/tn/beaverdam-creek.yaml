notes: Johnson County spring creek with cold, steady water and TWRA spring stocking; a favorite small-water
  rainbow stop on the Shatley Springs road corridor. The reach from the Birch Branch confluence down to Tank
  Hollow Road is a designated TWRA wild-trout water — open year-round, single-hook artificials only. No USGS
  gauge — plan on recent-rain judgment.
