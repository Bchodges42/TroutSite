notes: >-
  The northern fork of the Holston, entering Tennessee from Virginia shortly before its confluence with the
  South Fork Holston at Kingsport — the point where the Holston River main stem (holston-river) begins. The
  Tennessee reach is short (the fork forms the state line for its final miles); Virginia water upstream is out
  of scope. TWRA recognizes it as a separate named river. Renowned smallmouth water in Virginia; verify
  regulations and any consumption advisories before eating fish from this reach. TWRA's statewide regulation
  exceptions set a smallmouth bass rule on this water: 13–17 in protected length range, one over 17 in per
  day. (see officialSources).


  Regulations: Black Bass 5/day in combination; Smallmouth 13–17 in PLR, only 1 over 17 in/day — TN reach from
  the state line downstream to the confluence with the South Fork Holston (identical smallmouth rule also
  applies on the Holston main stem "John Sevier Dam upstream t… (retrieved 2026-09-14; verify current rules
  with TWRA before you go).
