notes: >-
  The northern fork of the Holston, entering Tennessee from Virginia shortly
  before its confluence with the South Fork Holston at Kingsport — the point
  where the Holston River main stem (holston-river) begins. The Tennessee
  reach is short (the fork forms the state line for its final miles); Virginia
  water upstream is out of scope. Recognized as a separate named river on the
  TWRA waterways rivers layer. Renowned smallmouth water in Virginia; verify
  regulations and any consumption advisories before eating fish from this
  reach.
