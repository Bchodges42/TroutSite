notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Stones River reservoir southeast of
  Nashville in Davidson, Rutherford, and Wilson counties. Detailed angler notes are still being prepared —
  check TWRA and local access areas in the meantime. TWRA's J. Percy Priest Reservoir page lists the fishery
  as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see
  officialSources). Striped bass is a regulatory or hybrid-evidence tag here; reservoir temperature/oxygen
  refuge context is not a scored input.

    Prominence A species fill (high): TWRA 2026 stocking schedule (tn.gov/twra/fishing/trout-information-stockings.html) row 'J. Percy Priest TW / Stones River' = tailwater reach, not the lake; no lake trout row — bass/crappie; the winter trout site is the TW / Stones River tailwater below the dam
