opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents J. Percy Priest Reservoir as a warmwater lake — its 'best fishing
    opportunities' list is all warmwater species — and confines the associated rainbow trout program
    to the tailwater below the dam, not the lake.
  reachScope: the USACE reservoir pool itself (Davidson, Rutherford, Wilson counties); the Stones
    River tailwater below the dam is a separate catalog water
  asOf: "2026"
  sources:
    - label: J. Percy Priest Reservoir — Where to Fish
      url: https://www.tn.gov/twra/fishing/where-to-fish/middle-tennessee-r2/percy-priest-reservoir.html
      kind: agency-assessment
      retrieved: 2026-09-22
      pinpoint: "'The best fishing opportunities are for Largemouth Bass, Crappie, Hybrid Striped Bass
        (Cherokee' bass), White Bass, Yellow Bass, and Channel Catfish.'; no trout anywhere on the
        page"
    - label: Cheatham Reservoir — Where to Fish (cross-reference)
      url: https://www.tn.gov/twra/fishing/where-to-fish/middle-tennessee-r2/cheatham-reservoir.html
      kind: schedule-table
      observationPeriod: annual winter program (first Friday in December start; January and February events)
      retrieved: 2026-09-22
      pinpoint: "'Beginning on the first Friday in December, the Dale Hollow National Fish Hatchery stocks
        catchable-size Rainbow Trout below J. Percy Priest Dam' — 2,000 fish per Jan/Feb event,
        7/day creel, type 022 supplemental license"
  caveats:
    - USACE host (lrn.usace.army.mil) remained unreachable this session (certificate/edge rejection,
      prior lead) — TVA/USACE release type stays unknown.
    - Catalog striped-bass species tag is regulatory/hybrid evidence per catalog notes.
