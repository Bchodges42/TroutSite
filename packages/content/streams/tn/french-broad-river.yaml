id: french-broad-river
name: French Broad River (Douglas tailwater)
stateId: TN
waterbodyType: tailrace
display: featured
regionId: tn-east-pigeon-frenchbroad
gaugeIds: []
stockingProgram: false
species: trout
fishery: tailwater
idealFlow:
  - min: 300
    max: 2000
    unit: cfs
idealFlowSource: editorial
notes: >-
  Cold Douglas Dam releases support a quieter, fringe trout fishery near the dam; TWRA’s stocking
  dataset does not currently list it — flag set conservatively. Flow is TVA-scheduled; verify releases.
  The river enters from North Carolina and runs through Douglas Lake down to the Holston confluence.
  TWRA's statewide regulation exceptions set smallmouth bass rules on this water: 18 in minimum on one reach, 13–17 in protected length range upstream. (see officialSources).

