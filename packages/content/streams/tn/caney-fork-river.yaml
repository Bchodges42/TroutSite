  caveats:
    - TWRA states there is no natural reproduction in the river - the fishery is entirely
      stocking-supported (put-grow-take), with browns documented to hold over to large sizes.
    - Summer/fall 2025 brought 'some of the worst oxygen and temperature conditions in several
      years' (2025 observation, reported in the 2026 forecast); early-2026 overwinter abundance was
      down ~30% from early 2025, though the 2026 survey ran double the 2020-2023 average and
      trophy-class fish fared better.
    - "Year-round strength is reach-dependent: TWRA names the upper 9 miles as the best year-round
      water within the ~15-mile trout reach."
    - Generation swings below Center Hill Dam are dramatic; check the TVA Center Hill schedule (node
      n-694pXX) before wading.
