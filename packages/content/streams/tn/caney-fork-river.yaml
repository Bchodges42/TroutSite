  statement: TWRA documents a year-round stocked trout tailwater below Center Hill Dam, strongest in
    the upper ~9 miles; note the documented summer/fall 2025 water-quality problems and
    generation-driven flow swings before you go.
  reachScope: Center Hill Dam tailwater of the Caney Fork River (~15 miles of trout water to
    Stonewall; best year-round fishing in the upper ~9 miles). Does NOT include Center Hill Lake.
