notes: >-
  Middle Tennessee’s signature tailwater: TWRA-stocked rainbows (stocking runs March through
  December) plus a celebrated winter/spring trophy brown trout program below Center Hill Dam.
  Generation swings are dramatic — Stonewall and at-dam gauges are your wade-window planners.


  Regulations: Center Hill Dam to Cumberland River: total trout creel 5; Rainbow/Brook/Cutthroat
  5/day with 14–20 in PLR, only 1 over 20 in; Brown Trout 1/day, 24-in minimum (retrieved
  2026-09-14; verify current rules with TWRA before you go).
