  statement: TWRA stocks Citico Creek's main stem weekly through the Tellico-Citico program (22
    consecutive 2026 weeks, Feb 22 - Jul 19) with a Tellico-Citico permit required Mar 1 - Aug 15; a
    headwater tributary (Falls Branch) holds a documented wild brook trout population - a seasonal
    stocked fishery plus wild headwaters, not a single year-round stocked fishery.
  reachScope: Stocked main stem (Tellico-Citico permit area) vs wild-brook headwater tributary (Falls Branch)
