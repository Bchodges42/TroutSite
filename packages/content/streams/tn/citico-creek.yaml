  caveats:
    - "The cataloged feature spans the stocked main stem AND wild headwater forks - keep the two
      stories separate: weekly stocked rainbows Feb-Jul on the permit-area main stem, wild brook
      trout on Falls Branch."
    - The permit-free Aug 16 - end-of-February window is a regulation, not evidence of trout
      presence in the main stem in winter; no holdover documentation exists for the stocked reach.
    - Permit/closure details (closed Thu-Fri Mar 1-Aug 15) apply per the Tellico-Citico program;
      verify current rules before you go.
