notes: >-
  Reference waterbody from the Tennessee waterways inventory — the Nashville-to-Lake Barkley main
  stem across Davidson to Stewart counties; the South Fork Cumberland River is a separate water.
  Detailed angler notes are still being prepared — check TWRA and local access areas in the
  meantime.


  Regulations: Black bass 5/day combined (Largemouth 14" min, Smallmouth 18" min, Spotted no limit);
  Crappie 30/day combined 10" min; Sauger 10/day 15" min; Striped/hybrid 2/day combined 15" min;
  White Bass 15/day; Walleye 5/day 16" min; (retrieved 2026-09-14; verify current rules with TWRA
  before you go).
