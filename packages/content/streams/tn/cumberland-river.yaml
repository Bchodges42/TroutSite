opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents the Nashville-reach Cumberland (Cheatham Lake pool) as a warmwater
    riverine fishery — black bass, crappie, catfish, white/striped bass and a December-March sauger
    run below Old Hickory Dam; no trout program exists on the Tennessee main stem itself.
  reachScope: "Cheatham Lake pool: Old Hickory Dam downstream to Cheatham Dam/Ashland City (the
    Nashville reach of the catalog's Nashville-to-Lake Barkley main stem); the free-flowing
    Cumberland below Cheatham Dam to Lake Barkley is not covered by the supporting source"
  asOf: "2026"
  sources:
    - label: Cheatham Reservoir — Where to Fish
      url: https://www.tn.gov/twra/fishing/where-to-fish/middle-tennessee-r2/cheatham-reservoir.html
