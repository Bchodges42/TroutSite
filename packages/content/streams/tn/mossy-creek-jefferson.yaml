  statement: TWRA's winter trout program is back on Mossy Creek in Jefferson City for 2025-26 -
    hundreds of rainbow trout stocked on the Carson-Newman campus reach in late November with more
    through January - while the creek is otherwise a small, impaired warmwater farm creek with no
    documented summer trout fishery.
  reachScope: Jefferson City reach (Carson-Newman University campus segment and greenway sites)
  asOf: "2026"
  sources:
