  caveats:
    - "New winter program: stocked January 14, 2026, with TBD November and December 2026 events -
      check TWRA's live schedule before going."
    - The trout program is cold-months only; the creek is 303(d)-listed for sedimentation and E.
      coli and TWRA's plan classes such waters as unable to support trout year round.
    - The Fishbrain 'Mossy Creek' page (blue catfish/striped bass dominated) needs segment review
      and is a lead only - do not read it as this creek's fishery.
