  caveats:
    - "Never transfer between the TAILWATER and the LAKE: Parksville Lake carries TWRA's year-round
      reservoir list entry; this reach carries only a March-May tailwater program. Neither claim
      describes the other."
    - "Recreation-flow context: the reach mixes whitewater recreation schedules with dam releases;
      check TVA Ocoee No. 1 flows before fishing."
    - Prior habitat research found no cold-storage mechanism documented for this release (Parksville
      is a shallow warmwater pool managed for walleye) - summer trout persistence is unevidenced,
      not disproven.
