notes: >-
  TWRA’s winter program schedules catchable trout at Eastern Flank Battle Park in Franklin. The 2026
  schedule lists January and February days and a tentative December day; these are planned stocking
  dates, not proof of a legal fishing season or current trout presence. Two gauges bracket the
  corridor. A prior smallmouth claim lacked species-specific primary evidence and was removed from
  the typed species list.


  Stocked trout fishery confirmed by agency sources (retrieved 2026-09-14) — TWRA winter program
  schedules the Harpeth at Eastern Flank Battle Park (Franklin) for winter stocking.


  Regulations: Statewide warmwater — black bass 5/day any combination, no length limit; crappie
  15/day, 10-in minimum; catfish no limit under 34 in, 1/day over 34 in; rock bass 20/day (retrieved
  2026-09-14; verify current rules with TWRA before you go).
