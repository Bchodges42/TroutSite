notes: >-
  Mostly a warmwater river — TWRA’s winter program stocks its Williamson County reaches near Franklin with
  catchable trout each December (the winter put-and-take season runs December–February; check the TWRA
  schedule for the current window). Two gauges bracket the stocked corridor; summer water is smallmouth
  country.


  Stocked trout fishery confirmed by agency sources (retrieved 2026-09-14) — TWRA winter program stocks the
  Harpeth at Eastern Flank Battle Park (Franklin) — December runs per the official schedule.
