  statement: "No reach-specific fishery evidence exists for the short Watauga River segment between
    Watauga Dam and Wilbur Lake: TWRA's year-round reservoir list names Watauga LAKE above the dam,
    the celebrated Wilbur tailwater assessment begins below Wilbur Dam, and the nearest stocking row
    names Wilbur Reservoir at this reach's downstream end — the reach itself is documented only by
    decades-old release-water temperatures."
