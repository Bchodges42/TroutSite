  caveats:
    - "SIBLING TRAP (audit hard case): this verdict covers ONLY the Watauga-Dam-to-Wilbur-Lake
      segment. The famous Wilbur TAILWATER below Wilbur Dam (catalog watauga-river) has its own
      year-round verdict; Watauga Lake above the dam and Wilbur Lake below the reach each have their
      own verdicts. Nothing transfers across the dams."
    - The reach is short, cold (by inference from historic release temperatures), and
      generation-dependent; no public-access documentation was verified this pass.
