  statement: "The Tennessee Powell River is documented warmwater water: TWRA sets a smallmouth
    protected-length rule on the upper reach and EPA's June 2024 survey at the upper-river site
    found a smallmouth/panfish assemblage with zero salmonids; the catalog's wild-rainbow/brown
    claim has no agency support."
