opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Boone Reservoir as a warmwater fishery — largemouth and smallmouth bass,
    striped and hybrid bass, and catfish predominant, with blue catfish, stripers, hybrids, and
    crappie stocked — and no lake trout program; trout regulations do extend into the Watauga arm
    because tailwater-origin trout enter it, but a lake-wide trout fishery is undocumented.
  reachScope: Boone Lake (Boone Reservoir) pool, Sullivan/Washington counties — from Boone Dam
    upstream to the Hwy 390 Bridge at Bluff City (South Fork Holston arm) and the new Austin Springs
    Bridge (Watauga arm); excludes the Boone tailwater below Boone Dam and both upstream tailwaters
  asOf: "2026"
  sources:
    - label: TWRA Boone Reservoir where-to-fish page
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/boone-lake.html
      kind: agency-assessment
      observationPeriod: 2026 (live page)
      retrieved: 2026-09-22
      pinpoint: '"Largemouth and Smallmouth Bass, Striped Bass, Hybrid Striped Bass, and catfish are the
        predominant game fish."; "the TWRA has stocked Blue Catfish, Striped Bass, Hybrid Striped
        Bass, and Black Crappie during the past several years"; "The TWRA has stocked Striped Bass
        and Hybrid Striped Bass in Boone since 1972." "Boone is a 4,520-acre TVA reservoir." The
        only trout line on the page is a regulation (see harvest-regulation claim). Verified live
        2026-09-22.'
  caveats:
    - Warmwater-focus is a documentation statement, not a biological absence claim — trout
      regulations extending into the Watauga arm show TWRA expects tailwater-origin trout in lake
      water there.
    - "REACH DISCIPLINE (audit hard case): the Boone TAILWATER below the dam is a separate catalog
      water with its own year-round verdict — none of its findings (holdover rainbows, 2026
      sampling, three-way stocking calendar conflict) transfer to this lake."
    - The two upstream tailwaters (South Holston; Wilbur/Watauga) discharge into this pool's arms —
      arm-level habitat differs sharply from the main pool.
