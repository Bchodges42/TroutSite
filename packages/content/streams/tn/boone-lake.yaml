notes: >-
  TVA reservoir on the South Fork Holston River northeast of Johnson City (Sullivan/Washington counties),
  impounded by Boone Dam (USGS 03486810, 36.44066/-82.43792). Two arms: the South Fork Holston arm fed by the
  South Holston Dam tailwater (south-holston-river) and the Watauga arm fed by the Wilbur Dam tailwater
  (watauga-river). Outflow is the Boone tailwater (boone-tailwater) down to Fort Patrick Henry Lake. Aliases:
  Boone Reservoir. TWRA's Boone Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted
  bass, crappie, bluegill, catfish, striped bass (see officialSources).

  Striped bass is a regulatory or hybrid-evidence tag here; reservoir temperature/oxygen refuge context is not
  a scored input.


  Regulations: LMB/SMB 5/day combined, 15" min; spotted bass 15/day no limit; crappie 15/day combined 10" min;
  striped/hybrid 2/day combined (1 striped max; 36" min striped, 15" min hybrid); (retrieved 2026-09-14;
  verify current rules with TWRA before you go).

    Prominence A species fill (high): TWRA Boone Lake where-to-fish + absence from trout-reservoir list — largemouth/smallmouth/spotted, striped bass + hybrids, blue catfish; trout regs apply only on cold Watauga arm to Hwy 11E (drift-in fish)
