notes: >-
  Remote Carter County headwaters with TWRA stocking and native brook trout upstream. The reach
  above the Dennis Cove cable crossing is a designated TWRA wild-trout water — open year-round.
  Steep, brushy, and rain-flashy.


  Regulations: Wild stream reach (above cable crossing near Dennis Cove): daily creel 5 trout, no
  length limit, single-hook artificial lures only, bait/multiple-hook lures prohibited; below the
  cable crossing: statewide (7 trout/day, no length limit) (retrieved 2026-09-14; verify current
  rules with TWRA before you go).
