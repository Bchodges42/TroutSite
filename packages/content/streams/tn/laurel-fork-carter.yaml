  evidenceState: documented
  statement: "A documented year-round trout water: TWRA designates Laurel Fork above the Dennis Cove
    cable crossing a wild trout water (single-hook artificials) with no seasonal closure listed, and
    TWRA's 2018 Region IV report documents wild brown trout dominating the stream with brook trout
    in the upper reach and nine tributaries; the lower reach additionally carries a Mar-Jun rainbow
    stocking program (eight 2026 weeks)."
  reachScope: Designated wild-trout reach above the Dennis Cove cable crossing (year-round); the lower
    stocked reach is a Mar-Jun put-and-take program
