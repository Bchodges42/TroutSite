notes: >-
  Small (~860 acre) TVA reservoir on the South Fork Holston River at Kingsport
  (Sullivan County), impounded by Fort Patrick Henry Dam (USGS 03487010,
  36.49816/-82.50904). Receives the Boone tailwater (boone-tailwater) at its
  upper arm and discharges through the dam into the Fort Patrick Henry
  tailwater (ft-patrick-henry-tailwater), which joins the North Fork Holston
  River to form the Holston main stem at Kingsport. Aliases: FPH Lake, Fort Patrick
  Henry Reservoir.
  TWRA's Fort Patrick Henry Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
  Striped bass is a regulatory or hybrid-evidence tag here; reservoir temperature/oxygen refuge context is not a scored input.
