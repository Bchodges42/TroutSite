  caveats:
    - "Evidence is intentionally marked limited: the year-round label is TWRA's program list
      (documented), but there is no reservoir fishery narrative, no stocking months, no depth
      guidance, and no lake survey — do not oversell."
    - Summer fishing character is undocumented for this water; TWRA provides no depth guidance here
      (unlike Watauga/South Holston). Never promise bank fishing.
    - The trout regulation shown on TWRA's reservoir page (Boone Dam to Louis Milhorn Bridge 16-22
      in PLR) belongs to the BOONE TAILWATER upstream — not to this lake's fishery.
    - The 2026 forecast 'largest holdover Rainbow Trout' finding is about the tailwater BELOW Fort
      Patrick Henry Dam and does not describe this lake.
