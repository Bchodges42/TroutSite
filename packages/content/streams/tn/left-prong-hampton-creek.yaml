notes: Left Prong, the Hampton Creek tributary in Carter County. Five trout
  daily with no length limit; single-hook artificial lures only. Use or
  possession of bait or multiple-hook lures is prohibited. One separated
  single-hook artificial dropper lure is permitted. No verified local live gauge
  is assigned.
