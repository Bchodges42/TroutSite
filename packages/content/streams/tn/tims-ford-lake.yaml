opportunity:
  trout: warmwater-focus
  evidenceState: documented
  statement: TWRA documents Tims Ford Lake as a warmwater black-bass/crappie/striped-bass/walleye
    fishery with no trout program in the reservoir; the documented year-round trout water is the Elk
    River below Tims Ford Dam - a separate catalog water.
  reachScope: Tims Ford Reservoir itself (10,600 ac Elk River impoundment, Franklin/Moore counties).
    Not the Elk River tailwater below Tims Ford Dam.
  asOf: "2026"
  sources:
    - label: "TWRA Where to Fish: Tims Ford Reservoir"
      url: https://www.tn.gov/twra/fishing/where-to-fish/middle-tennessee-r2/tims-ford-reservoir.html
      kind: agency-assessment
      retrieved: 2026-09-22
      pinpoint: "'What you can catch': Black Bass (largemouth/smallmouth), Crappie (white/black), Hybrid
        and Striped Bass, Walleye; 'TVA owns and operates Tims Ford Reservoir', dam completed 1970,
        10,600-acre impoundment; trout appears nowhere in the fishery description (verified live
        2026-09-22)"
    - label: Tims Ford Lake surface temperatures
      url: https://www.waterqualitydata.us/data/Result/search?siteid=NALMS-F1272660&characteristicName=Temperature,%20water&mimeType=csv
      kind: temperature-series
      observationPeriod: 2002-2023
      retrieved: 2026-09-22
      pinpoint: "NALMS mid-lake: 27.3 and 28.2 C on 2002-06-24; TDEC Boiling Fork arm station: 31.0 C Jul
