  caveats:
    - "Reach discipline: every trout fact attached to 'Tims Ford' (the year-round '24-7-365' reach,
      the Mar-Dec stocking, the 20-inch brown rule) belongs to the Elk River BELOW Tims Ford Dam
      (elk-river). None of it describes the lake."
    - The 2026 forecast's Tims Ford section (nodes n-0Qzf3q, n-xMHich) is entirely about the
      tailwater reach.
    - Fishbrain's 'Tims Ford Lake (Elk River)' shared page aggregates tailwater trout catches with
      lake catches (16 rainbow) - research lead only, likely tailwater contamination.
