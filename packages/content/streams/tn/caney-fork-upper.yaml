  caveats:
    - The forecast's Caney Fork assessment (node n-oROWU2) describes the tailwater BELOW Center Hill
      Dam only; none of its trout content transfers to this reach.
    - The documented cold-season fishery here is the Jan 1-Apr 30 walleye run (single-hook rule,
      Rock Island ramp upstream to Great Falls Dam) per TWRA regulations.
    - Fishbrain's single shared 'Caney Fork River' page aggregates catches across all three reaches
      (tailwater included) - its trout counts are research leads only and are likely
      tailwater-dominated.
