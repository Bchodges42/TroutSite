notes: >-
  Free-flowing upper Caney Fork from the Cumberland County headwaters down through Rock Island to the
  slackwater pools pooled above Center Hill Dam — Great Falls Lake (great-falls-lake) at Rock Island and the
  long Center Hill Lake (center-hill-lake) arms. Warmwater water: smallmouth and bream country; no trout
  program is documented this far above the dams and no gauge-based condition is published for this reach. The
  celebrated tailwater fishery begins at the dam on the caney-fork-river reach.


  Regulations: Walleye run — Jan 1–Apr 30: "restricted to the use of one (1) hook having a single barb or lure
  containing a single hook with one barb"; max 3 rods/poles (Rock Island ramp upstream to Great Falls Dam).
  (retrieved 2026-09-14; verify current rules with TWRA before you go).
