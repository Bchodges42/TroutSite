id: caney-fork-upper
name: Caney Fork River (above Center Hill Lake)
stateId: TN
waterbodyType: river
regionId: tn-middle-caney-fork
gaugeIds: []
stockingProgram: false
idealFlow: []
notes: >-
  Free-flowing upper Caney Fork from the Cumberland County headwaters down
  through Rock Island to the slackwater pools pooled above Center Hill Dam —
  Great Falls Lake (great-falls-lake) at Rock Island and the long Center Hill
  Lake (center-hill-lake) arms. Warmwater water: smallmouth and bream country;
  no trout program is documented this far above the dams and no gauge-based
  condition is published for this reach. The celebrated tailwater fishery
  begins at the dam on the caney-fork-river reach.
