  statement: "The Fentress County Wolf River pairs two documented fisheries: TWRA's spring rainbow
    stockings on the headwaters (March-May 2026 weeks) over a TWRA-documented warmwater
    spotted/smallmouth bass fishery on the managed reach - the trout program is put-and-take with no
    year-round documentation."
