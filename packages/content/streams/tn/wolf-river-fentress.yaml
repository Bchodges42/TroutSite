    - TWRA documents spotted bass 'in the upper portions of the Wolf River' and a special smallmouth
      rule upstream to the South Ford Road bridge - a warmwater fishery coexists with the trout
      program.
    - "Same-name check: this is the Fentress County headwaters feeding Dale Hollow (HUC 05130105),
