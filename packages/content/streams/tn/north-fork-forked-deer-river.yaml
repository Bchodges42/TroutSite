  statement: TWRA manages the Forked Deer rivers under a West Tennessee crappie rule (30/day, no
    length limit), documenting a managed warmwater fishery on the North Fork; no trout program
    exists on this fork, and a single community-app trout entry remains an uncorroborated lead.
