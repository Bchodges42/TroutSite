  caveats:
    - "SUMMER LIMITATION (mandatory): TWRA states water temperatures in late summer and early fall
      often get too warm to support trout in the majority of the tailwater; the fishery is strongest
      from the November-April stocking season into spring."
    - This verdict covers ONLY the ~20-mile Cherokee Dam tailwater reach (Jefferson/Grainger). The
      Holston main stem above the reach (Kingsport to Cherokee Dam) and below it have no trout
      evidence in this pass and remain separately unresolved; Cherokee LAKE upstream of the dam is a
      separate catalog water with a documented warmwater fishery.
    - Access is limited to a few locations (ramps below the dam and at Nances Ferry); the river is
      best fished from a boat.
    - The repo site feed's 'warmwater fishery, no trout program' line for holston-river is
      contradicted by TWRA's live schedule, static table, and 2026 forecast — the trout program is
      real and reach-pinned to the Cherokee tailwater.
