notes: >-
  The main Holston below the North/South Fork confluence at Kingsport through Hawkins, Grainger,
  Jefferson, and Knox counties to the French Broad confluence at the head of Fort Loudoun Lake; the
  South Fork Holston tailwaters are separate catalog features (south-holston-river, boone-tailwater, ft-
  patrick-henry-tailwater), the northern fork is north-fork-holston-river, and Cherokee Lake lies mid-
  stem, with the river continuing through the pool.
  TWRA's statewide regulation exceptions set a smallmouth bass rule on this water: 13–17 in protected length range, one over 17 in per day. (see officialSources).

