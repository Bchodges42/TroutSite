notes: >-
  The main Holston below the North/South Fork confluence at Kingsport through Hawkins, Grainger,
  Jefferson, and Knox counties to the French Broad confluence at the head of Fort Loudoun Lake; the
  South Fork Holston tailwaters are separate catalog features (south-holston-river, boone-tailwater,
  ft- patrick-henry-tailwater), the northern fork is north-fork-holston-river, and Cherokee Lake
  lies mid- stem, with the river continuing through the pool. TWRA's statewide regulation exceptions
  set a smallmouth bass rule on this water: 13–17 in protected length range, one over 17 in per day.
  (see officialSources).


  Stocked trout fishery documented by agency sources in the 2026-09 wave-ledger sourcing pass
  (retrieved 2026-09-14) — Cherokee Dam tailwater reach of the main-stem Holston carries Nov–Apr
  stocked trout (wave-2).


  Regulations: Black bass 5/day combo; smallmouth 13–17 in PLR, only 1/day over 17 in (Cherokee Dam
  to I-40 bridge); trout statewide — 7 trout/day any combination, no minimum length (retrieved
  2026-09-14; verify current rules with TWRA before you go).


  Correction (2026-09-22, evidence ledger): yearRound false → true — the adjudicated headline is
  year-round-trout on documented reach evidence (Cherokee Dam tailwater reach of the Holston River
  main stem — approximately 20 miles below Cherokee Dam (Jefferson/Grainger counties); the rest of
  the Kingsport-to-French-Broad main stem is NOT covered by trout evidence) (ADR 0010 consistency).
