  statement: TWRA's 2026 forecast documents a ~20-mile trout fishery on the Holston River below
    Cherokee Dam with November-April stocking labeled 'limited year-round fishing' — trout fishing
    that is seasonal in character because late-summer water often gets too warm, yet with some
    holdover fish possible.
