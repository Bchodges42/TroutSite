notes: >-
  TWRA spring-stocked Van Buren County creek. Karst-influenced flows can change quickly.


  Regulations: Statewide trout — 7/day any combination, no minimum length; not on TWRA Wild Trout
  Streams list; the Caney Fork 14-20" PLR special regs apply only to the tailwater below Center Hill
  Dam, not this tributary (retrieved 2026-09-14; verify current rules with TWRA before you go).
