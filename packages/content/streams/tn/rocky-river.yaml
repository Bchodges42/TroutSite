    - No holdover or wild-trout documentation; August grabs at the stocked crossing reached
      24.5-26.5 C.
    - TWRA's muskellunge rule for 'Above Center Hill Dam and tributaries' covers this creek; the
      Caney Fork tailwater trout PLR does not.
