notes: Karst-influenced Wilson County creek in TWRA’s winter program — the name is the geology
  lesson. Steady-ish flows by creek standards. NHD itself maps the creek as discontinuous
  fragments across Wilson County (verified 2026-09: corridor probes found no NHD segment crossing
  the inter-fragment gaps — only disconnected unnamed subnetworks and a separate gnis-named
  'Sinking Creek' artificial path inside them), so the delivered geometry keeps the genuine
  karst discontinuities as fragments rather than bridging them.
