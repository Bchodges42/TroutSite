  caveats:
    - "Winter-window fishery: 2026 rows are February 4, February 27 and a TBD December 2026 event at
      the greenway sites."
    - TWRA documents the West Fork as a white/yellow bass spring-run fishery; on-reach summer
      monitoring reads 28-30 C. Do not represent the trout program as year-round.
    - "Identity: this is the WEST Fork in Rutherford County - not the Davidson County main stem
      below Percy Priest Dam and not the East Fork."
