notes: >-
  Murfreesboro’s winter-trout water — TWRA-stocked rainbows in an urban greenway setting,
  December–February. Gauge at Murfreesboro.


  Regulations: statewide trout (7/day, no min) at the stocked site; warmwater statewide — black bass
  5/day no min; crappie 15/day 10-in (Region 2 default); catfish only 1 over 34 in/day. (retrieved
  2026-09-14; verify current rules with TWRA before you go).
