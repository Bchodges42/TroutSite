  statement: TWRA's winter trout program stocks the West Fork Stones River greenway at Manson Pike
    Trailhead (and Nice Mill) with rainbow trout in the cold months (February 2026 rows plus a TBD
    December 2026 event); TWRA separately documents the forks as a warmwater white/yellow bass
    spring-run fishery - a cold-months trout window on a warmwater urban river.
  reachScope: Murfreesboro greenway reach (Manson Pike Trailhead and Nice Mill sites)
  asOf: "2026"
