notes: TWRA winter put-and-take lake in Paris (Henry County). Stocked with rainbow trout in the cold
  months only — the fish do not hold over summer. TWRA lists the site as Paris City Park; the mapped
  water is the city-run Green Acres Lake (aka Williams Lake) — the secondary Eiffel Tower Park pond
  is a different water. Check the TWRA schedule for the current winter window before you go.
