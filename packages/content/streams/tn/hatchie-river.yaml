notes: >-
  Reference waterbody from the Tennessee waterways inventory — a west-flowing river through the West
  Tennessee Hatchie corridor (Hardeman, Haywood, Tipton, and Lauderdale counties). Detailed angler
  notes are still being prepared — check TWRA and local access areas in the meantime. TWRA's
  statewide regulation exceptions include this river in the shared West Tennessee crappie rule: 30
  per day, no length limit. (see officialSources).


  Regulations: Crappie 30/day, no length limit (Hatchie incl. tributaries, per exceptions page);
  statewide black bass 5/day, catfish 34-in rule otherwise (retrieved 2026-09-14; verify current
  rules with TWRA before you go).
