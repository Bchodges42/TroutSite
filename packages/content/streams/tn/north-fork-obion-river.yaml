opportunity:
  trout: warmwater-focus
  evidenceState: limited
  statement: TWRA manages the Obion rivers and their tributaries under a West Tennessee crappie rule
    (30/day, no length limit), documenting a managed warmwater fishery on the North Fork Obion; no
    trout program exists and no trout record of any kind was found on this channelized lowland fork.
  asOf: "2026"
  sources:
    - label: Fishing regulation exceptions
      url: https://www.tn.gov/twra/fishing-regs/fishing-regulation-exceptions.html
      kind: agency-assessment
      observationPeriod: current regulation year
      retrieved: 2026-09-22
      pinpoint: "'Forked Deer, Hatchie, Loosahatchie, Obion, and Wolf Rivers ( includes tributaries) •
        Crappie: 30 per day, no length limit.'"
    - label: Survey of the Obion River system fish fauna
      url: https://trace.tennessee.edu/utk_gradthes/8225
      kind: agency-assessment
      observationPeriod: 1973 collections
      publicationDate: "1973"
      retrieved: 2026-09-22
      pinpoint: "prior batch record: verified 100 fish species with most collections from the principal
        forks; no salmonids listed"
    - label: North Fork Obion River near Martin temperature grabs
      url: https://www.waterqualitydata.us/data/Result/search?siteid=USGS-07025400&characteristicName=Temperature,%20water&mimeType=csv
      kind: temperature-series
      observationPeriod: grabs 1986-2002 (26.0-28.0 C summer)
      retrieved: 2026-09-22
      pinpoint: "prior batch record: 28.0 C July 1986; 27.0 C August 2002; 26.0 C July 2002"
  caveats:
    - The nearest TWRA winter rainbow sites in this part of West Tennessee are park ponds (e.g.
      Union City Reelfoot Packing Site), not this river.
    - Warmwater-focus does not mean trout are biologically absent.
