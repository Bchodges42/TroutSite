  statement: No trout survey, stocking record, temperature record, or agency fishery documentation of
    any kind was found for the West Fork Obey River (Overton County headwater fork above Dale Hollow
    Lake); the famous Obey trout fishing is the Dale Hollow Dam tailwater — a different water.
  asOf: "2026"
  caveats:
    - The stocked 'Obey River' is the Dale Hollow Dam tailwater (hatchery below the dam) and the
      Dale Hollow Reservoir — separate catalog waters; the East Fork special regulation (Compton
      ramp to Hwy 52 bridge) is also a different reach.
    - American Whitewater documents a ~6-mile West Fork float run (TN 85 bridge to the lake) —
      paddling access, not a fishery record.
