notes: >-
  Short, flashy reach below Boone Dam near Kingsport carrying TWRA-stocked rainbow and brown trout. Flow
  swings hard with TVA generation; treat the ideal band as a guideline and verify releases.


  Regulations: Managed under the Fort Patrick Henry Reservoir rule — "Boone Dam downstream to Louis Milhorn
  Bridge on Beulah Church Drive": 16–22 in PLR rainbow/brown; 7-trout creel (all species combined), only 1
  over 22 in (retrieved 2026-09-14; verify current rules with TWRA before you go).
