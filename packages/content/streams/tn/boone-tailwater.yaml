        Trout across the state.\" Capture: captures/twra-forecast-text.md; verified live
        2026-09-22."
    - label: TWRA published trout stocking schedule (2026), weekly program table
      url: https://www.tn.gov/twra/fishing/trout-information-stockings/_jcr_content/contentFullWidth/tn_complex_datatable_1990410459.exceldriven.json
      kind: schedule-table
