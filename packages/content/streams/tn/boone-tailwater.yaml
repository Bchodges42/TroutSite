        captures/twra-schedule.json (616 rows).'
  caveats:
    - TWRA's own 2026 sampling shows abundance at the low end of the 2008-2026 series even though
      large-fish rates are among the state's best — expect a tough, trophy-oriented fishery, not
      fast action.
    - Access is very limited; the forecast recommends fishing it by boat at one generator, launching
      at Smith Shoals off Beulah Church Drive.
    - TVa generation can raise the water several feet quickly; check the TVA Boone Dam schedule
      before wading or floating.
    - Stocking months shown anywhere on the site are a documented three-way conflict between current
      TWRA sources and are not the fishing window.
