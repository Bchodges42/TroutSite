  evidenceState: documented
  statement: TWRA's 2026 trout forecast calls the Boone Tailwater Tennessee's smallest year-round
    trout-fishing tailwater — a short, boat-oriented reach with a modest rainbow/brown population
    that regularly produces trophy fish, confirmed by March 2026 electrofishing.
  reachScope: South Fork Holston River below Boone Dam (Boone Tailwater), Sullivan County — from Boone
    Dam downstream to the head of Fort Patrick Henry Lake; special trout regs apply from the dam to
    Louis Milhorn Bridge on Beulah Church Drive
  asOf: "2026"
  sources:
    - label: TWRA Trout Fishing Forecast StoryMap (2026 edition), Boone Tailwater section
      url: https://www.arcgis.com/sharing/rest/content/items/dbb92bdf718f4fd7839bf4b08fb82747/data?f=json
