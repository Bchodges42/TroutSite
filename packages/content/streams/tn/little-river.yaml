notes: >-
  The Smokies’ marquee water: wild rainbow and brown trout inside the park, with TWRA spring
  stocking on the lower, out-of-park reaches near Walland and Maryville. The Townsend gauge is the
  wade-flow reference; park waters have special regs — verify with NPS. It runs from the Smokies
  headwaters down to the Fort Loudoun Lake embayment near Maryville/Alcoa.


  Regulations: TWO ZONES. Inside GRSM (NPS): 5 brook/rainbow/brown trout or smallmouth bass per day
  combined, 7-inch min on trout/smallmouth, artificial flies/single-hook lures only, all bait
  prohibited, year-round (retrieved 2026-09-14; verify current rules with TWRA before you go).


  Correction (2026-09-22, evidence ledger): yearRound false → true — the adjudicated headline is
  year-round-trout on documented reach evidence (Upper reach - GSMNP and the watershed upstream of
  river mile 33.0 (TDEC's NRTS reach): year-round wild trout water. Lower reach - river miles 0-33
  (Townsend/Walland/Maryville corridor, out of the park): seasonal TWRA rainbow stocking over
  warmwater smallmouth water.) (ADR 0010 consistency).
