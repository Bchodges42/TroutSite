id: little-river
name: Little River (Smokies / Blount County)
stateId: TN
waterbodyType: creek
regionId: tn-east-smokies
gaugeIds:
  - "03497300"
  - "03498500"
stockingProgram: true
species: trout
idealFlow:
  - min: 50
    max: 350
    unit: cfs
notes: >-
  "The Smokies’ marquee water: wild rainbow and brown trout inside the park, with TWRA spring stocking
  on the lower, out-of-park reaches near Walland and Maryville. The Townsend gauge is the wade-flow
  reference; park waters have special regs — verify with NPS." It runs from the Smokies headwaters
  down to the Fort Loudoun Lake embayment near Maryville/Alcoa.

