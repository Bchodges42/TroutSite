  caveats:
    - "The feature spans three fishery identities - keep them separate: (1) park/upper reach =
      year-round wild trout (NPS; NRTS RM 33.0-origin); (2) lower out-of-park reach = seasonal TWRA
      rainbow stocking Feb-May + late Oct-Nov; (3) boundary/lower river = documented smallmouth
      water (no trout designation on the mile 0-33 row)."
    - "Legal designation ≠ abundance: the NRTS mark records TDEC's designated use, not a fish count."
    - "Same-name discipline: many 'Little River's exist in Tennessee; the schedule join is verified
      by Blount County rows and Blount GIS points."
