notes: >-
  TVA impoundment of the Duck River above Normandy Dam (Bedford County). The duck-river-tailwater
  catalog reach begins at the dam; this reservoir is the water the Duck backs up into upstream of
  it. Promoted from the passive lake source to an authoritative NHD polygon so the visible water
  is identified and selectable.
