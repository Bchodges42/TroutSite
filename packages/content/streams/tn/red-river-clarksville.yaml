notes: >-
  Warmwater Clarksville river (bass and catfish water). Mud-prone watershed — check the Port Royal
  gauge after any rain.


  Correction (2026-09-22): the broad river is a warmwater fishery, but TWRA's 2026 schedule lists
  winter rainbow trout stocking at Billy Dunlop Park on the Clarksville reach. The earlier
  no-trout-program note was contradicted by that named stocking site. No river-wide trout presence
  is established by the park schedule.


  Regulations: no Red River exception listed on TWRA's exceptions page — statewide rules govern:
  black bass 5/day any combination, no minimum; crappie 15/day, 10-in minimum; walleye 5/day, 16-in
  minimum; catfish no limit under 34 in with only 1 over 34 in/day; (retrieved 2026-09-14; verify
  current rules with TWRA before you go).
