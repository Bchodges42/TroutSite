notes: >-
  Warmwater Clarksville river (bass and catfish water). Mud-prone watershed — check the Port Royal gauge after
  any rain.


  Correction (2026-09-15): agency sources document a warmwater fishery with no trout program or record —
  Warmwater river (smallmouth/largemouth/spotted bass, white bass, catfish); no TWRA trout stocking row or
  trout record. (retrieved 2026-09-14).


  Regulations: no Red River exception listed on TWRA's exceptions page — statewide rules govern: black bass
  5/day any combination, no minimum; crappie 15/day, 10-in minimum; walleye 5/day, 16-in minimum; catfish no
  limit under 34 in with only 1 over 34 in/day; (retrieved 2026-09-14; verify current rules with TWRA before
  you go).
