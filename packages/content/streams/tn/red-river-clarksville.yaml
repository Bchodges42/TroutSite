        cell-randomized, so the point scatter does NOT indicate distinct river locations
  caveats:
    - Winter put-and-take only (Dec-Feb program design); no summer carryover documentation.
    - No Red River exception exists on TWRA's exceptions page - statewide rules govern.
    - The iNat series is one observer's work with obscured coordinates; treat as corroboration, not
      a census.
