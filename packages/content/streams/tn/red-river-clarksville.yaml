  statement: TWRA's winter program stocks rainbow trout at Billy Dunlop Park on this river (Feb 18 and
    a TBD December 2026 date in the 2026 schedule), and research-grade community observations
    documented rainbows in the Red River corridor near Clarksville Nov 2023-Mar 2024 - a winter
    put-and-take fishery; the river itself is documented nowhere as more than a warmwater
    bass/catfish stream in this pass.
  reachScope: Billy Dunlop Park reach, Clarksville (Montgomery County)
  asOf: "2026"
