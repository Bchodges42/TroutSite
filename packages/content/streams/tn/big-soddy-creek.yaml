  statement: TWRA's 2026 forecast describes Big Soddy Creek (Soddy-Daisy, Hamilton Co.) as a new 7-8
    month trout fishery - 'not cold enough to support trout year-round' - with stocking Oct-May and
    a delayed-harvest catch-and-release reach upstream of Back Valley Road.
