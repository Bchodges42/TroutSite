  caveats:
    - The delayed-harvest rules (catch-and-release, artificials-only during C&R) apply upstream of
      Back Valley Road only; other reaches follow statewide rules.
    - The forecast's flow-gauge link is on North Chickamauga Creek (USGS 03566535), a different
      creek used as a rise/fall reference - it does not measure Big Soddy Creek.
    - Verify the current C&R start date (Oct 1 vs Nov 1) with TWRA Region 3 before fishing the C&R
      season.
