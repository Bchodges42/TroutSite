  statement: No trout survey, stocking record, or dated trout observation was found for North Mouse
    Creek (McMinn/Bradley counties, Hiwassee basin); a single community-app brown-trout entry is an
    uncorroborated lead and the creek's fishery is undocumented in admissible sources.
  asOf: "2026"
  caveats:
    - Distinct from South Mouse Creek and Little South Mouse Creek, which drain the Cleveland side
      (Bradley County) — same-name risk within the Mouse Creek family.
    - The nearest TWRA trout water in the area is the stocked Athens City Park Pond (a separate
      water).
    - Absence of community trout corroboration is never proof of trout absence.
  unresolvedQuestion: "No reach-specific trout survey, completed-release record, or dated trout
    observation was found for North Mouse Creek; whether any trout opportunity exists is unknown.
    Next source: TWRA Region 3 sampling or a TDEC fish-community survey of the lower (Bradley
    County) reach."
