  statement: TWRA and Standing Stone State Park stock this Overton County Mill Creek with catchable
    rainbow trout on two spring stocking weeks (late March and late April 2026); no year-round trout
    fishery is documented, and July-August park monitoring has read up to 28 C.
  reachScope: Standing Stone State Park reach (three stocking sites at 36.4709-36.4727, -85.4183 to -85.4208)
