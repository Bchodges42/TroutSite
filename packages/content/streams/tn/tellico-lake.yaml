  statement: TWRA places Tellico (Upper) in its year-round reservoir trout stocking program and
    documents ~4,500 catchable rainbow trout released annually in the late-winter/early-spring
    window in the cool upper arm below Chilhowee Dam, over a predominantly warmwater reservoir
    fishery.
  reachScope: Tellico Reservoir's upper Little Tennessee arm below Chilhowee Dam - the water TWRA
    lists as 'Tellico (Upper)'. Not the free-flowing Tellico River (tellico-river).
  asOf: "2026"
  sources:
