notes: >-
  TVA reservoir on the Little Tennessee River in Loudon, Monroe, and Blount
  counties, impounded by Tellico Dam at Lenoir City. Receives the Little
  Tennessee River (little-tennessee-river) below Chilhowee Dam, the Tellico
  River (tellico-river), and Citico Creek; discharges to Fort Loudoun Lake
  through the dam and the connecting canal. TWRA maps the reservoir at
  15,788 ac. Aliases: Tellico Reservoir.
  TWRA's Tellico Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
