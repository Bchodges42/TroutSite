    - label: "TWRA Where to Fish: Tellico Reservoir"
      url: https://www.tn.gov/twra/fishing/where-to-fish/east-tennessee-r4/tellico-reservoir.html
      kind: schedule-table
      retrieved: 2026-09-22
      pinpoint: "'About 4,500 catchable Rainbow Trout are released there in the late winter and early
        spring annually'; 'Rainbow Trout are stocked in the upper reaches of the reservoir below
