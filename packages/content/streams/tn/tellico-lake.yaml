  caveats:
    - "Identity discipline: 'Tellico (Upper)' on TWRA's reservoir list is the upper arm of Tellico
      Reservoir; the Tellico River's stockings, delayed harvest, and wild trout are a different
      catalog water (tellico-river). Never transfer between them."
    - Stocking is late winter/early spring; the catalog's seasonMonths [2,3,4] describes stocking
      months, not the extent of the fishing window.
    - Fishbrain's 'Tellico Reservoir (Tennessee River)' page is shared with the mainstem Tennessee
      River (7 rainbow trout among 1,794 catches) - research lead only.
