notes: >-
  Reservoir on the Little Tennessee River in Blount County below the Chilhowee Mountains, impounded
  by Chilhowee Dam. Receives the Little Tennessee River from Calderwood Lake and discharges into
  Tellico Lake. TWRA stocks the reservoir with rainbow trout in February, November, and December.
  TWRA maps the reservoir at 1,738 ac. TWRA's Chilhowee Reservoir page lists the fishery as
  largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish (see officialSources).
  The live trout list carries rainbow trout while an older plan snapshot differs; use the live list
  with the dated conflict noted in the source record.


  Correction (2026-09-22, evidence ledger): yearRound false → true — the adjudicated headline is
  year-round-trout on documented reach evidence (Chilhowee Reservoir itself (Blount/Monroe counties,
  Little Tennessee River between Calderwood and Chilhowee dams).) (ADR 0010 consistency).
