notes: >-
  Reservoir on the Little Tennessee River in Blount County below the
  Chilhowee Mountains, impounded by Chilhowee Dam (dam at the pool's
  downstream extremum ≈35.5623/-84.0252, from the NHD pool shape; no NWIS dam
  gauge). Receives the Little Tennessee River from Calderwood Lake and
  discharges into Tellico Lake. Verified geometry: USGS NHDPlus HR
  NHDWaterbody GNIS 01280464 (6.8 km²; TWRA "Chilhowee Reservoir" 1,738 ac).
  Represented on the TWRA waterways map but previously absent from the atlas.
