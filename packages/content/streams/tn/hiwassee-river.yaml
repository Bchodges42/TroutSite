notes: >-
  The Southeast’s big tailwater: TWRA-managed delayed-harvest-free trophy water with wild-strength rainbow,
  brown and some brook trout, and famous summer evening hatches (White Fly, Yellow Sally). A winter
  catch-and-release season (Oct 1–Feb 28) keeps the river fishable all year. Two- and four-turbine releases
  swing flow hard — the Reliance gauge is the call. The tailwater runs from the Appalachia Dam release water
  at the NC line through Reliance to the Chickamauga Lake head.


  Regulations: Appalachia Powerhouse downstream to L&N Railroad Bridge: Mar 1–Sep 30 — 7-trout creel, only 2
  may be brown trout; Catch-and-Release season Oct 1–Feb 28 (artificial lures only, no harvest/possession)
  (retrieved 2026-09-14; verify current rules with TWRA before you go).
