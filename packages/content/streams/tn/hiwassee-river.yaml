opportunity:
  trout: year-round-trout
  evidenceState: documented
  statement: "TWRA documents year-round stocked trout fishing on the Hiwassee tailwater, but
    explicitly as 'limited year-round fishing': elevated summer water temperatures prevent many
    trout from holding over, so the year-round label carries a real summer limitation."
  reachScope: Hiwassee tailwater trout water from Apalachia Powerhouse to Patty Bridge Access (~17
    miles; most productive 5 miles Powerhouse to Reliance). The ~8 miles of riverbed between
    Apalachia Dam and the powerhouse are bypassed by pipeline and are not the trout water.
