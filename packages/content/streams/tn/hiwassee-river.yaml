notes: "The Southeast’s big tailwater: TWRA-managed delayed-harvest-free trophy water with
  wild-strength rainbow, brown and some brook trout, and famous summer evening hatches (White
  Fly, Yellow Sally). Two- and four-turbine releases swing flow hard — the Reliance gauge is the
  call."
