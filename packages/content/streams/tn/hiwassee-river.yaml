  caveats:
    - "SUMMER LIMITATION (prominent, per TWRA's own label): 'limited year-round fishing'; 'Elevated
      water temperatures in the summer prevent many trout from holding over' - fish the summer
      season on fresh stockings and evening flows, not on expectations of a large resident
      population."
    - "Reach discipline: cold trout water begins at Apalachia POWERHOUSE - the release water tunnels
      ~8 miles through mountains, bypassing the first stretch of riverbed below the dam; the trout
      reach runs ~17 miles from the Powerhouse to Patty Bridge, with the best 5 miles Powerhouse to
      Reliance."
    - Two- and four-turbine generation swings are severe; TVA recreational releases run Memorial Day
      to Labor Day (node n-SfEsRH).
    - "Species note: the forecast lists Brook, Brown, Cutthroat and Rainbow as species caught; brood
      brook trout (2-3 lb) were stocked in winter per the 2026 biologist report."
