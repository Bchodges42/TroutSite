  evidenceState: documented
  statement: TWRA stocks Horse Creek (Greene County, Cherokee NF) weekly in spring-early summer (eight
    2026 weeks, Mar 1 - Jun 7) with a special trout regulation on the national-forest reach (7/day,
    dropping to 2/day May 1 - Sep 30 above the USFS boundary); TWRA's plan also lists the creek's
    upper watershed as holding wild rainbows and a potential brook-trout restoration candidate.
  reachScope: Stocked reach runs down the Cherokee NF valley to the Nolichucky; the special limit
    applies above the USFS boundary to Squibb Creek junction
