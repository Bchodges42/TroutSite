notes: >-
  Cherokee National Forest creek with TWRA spring stocking and nearby Dillard Ponds put-ins. Classic
  bank-and-boulder small water running down to the Nolichucky.


  Regulations: "Horse Creek: Greene County, U.S. Forest Service Boundary Line upstream to the
  junction of Squibb Creek. Daily limit: Seven (7) trout per day, except from May 1– Sep. 30 daily
  limit is two (2) trout." (special trout regulation; (retrieved 2026-09-14; verify current rules
  with TWRA before you go).
