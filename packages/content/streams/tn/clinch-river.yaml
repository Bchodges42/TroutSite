notes: >-
  One of the East’s classic tailwaters: big sulphur hatches, special-regulation trophy water below
  Norris Dam, and a famous mid-river sandbar flats scene. Flow is TVA-driven; the gauge below the
  dam is the wade-window truth-teller. The special-regulation trout water runs from Norris Dam to
  the Hwy 61 bridge; below that the Clinch becomes the Melton Hill pool (see melton-hill-lake)
  before reaching its mouth at Kingston.


  Regulations: Norris Dam downstream to Hwy 61 bridge (incl. tributaries): 14–20 in PLR on all
  trout; 7-trout creel, only 1 over 20 in (retrieved 2026-09-14; verify current rules with TWRA
  before you go).


  Triage apply (2026-09-24): reach sentence trimmed to the documented Hwy 61 boundary — the previous
  wording extended the tailwater claim through the Melton Hill pool
