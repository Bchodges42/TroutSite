  caveats:
    - The documented trout water is the ~14 miles from Norris Dam to the Hwy 61 Bridge at Clinton;
      below Hwy 61 the Clinch impounds into Melton Hill Lake — do not extend the tailwater trout
      claim lake-wide.
    - Trout water downstream of the weir/dam reach warms toward Kingston; TWRA's own reach
      definition ends at Hwy 61.
    - Stocking months differ by one month between current TWRA publications (Mar-Aug vs Mar-Sep);
      stocking months are not the fishing window (TWRA labels it year-round fishing).
