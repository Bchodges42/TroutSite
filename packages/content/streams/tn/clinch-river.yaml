notes: >-
  "One of the East’s classic tailwaters: big sulphur hatches, special-regulation trophy water below
  Norris Dam, and a famous mid-river sandbar flats scene. Flow is TVA-driven; the gauge below the dam is
  the wade-window truth-teller." Verified geometry (geo/east-fix rebuild): NHDPlus HR NHDFlowline GNIS
  Clinch River from the Norris Dam crest (USGS 03533000) through the Melton Hill pool (line-over-pool by
  design) to the Clinch mouth at Kingston / Watts Bar Lake; single welded chain.

