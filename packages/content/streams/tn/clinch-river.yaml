notes: >-
  One of the East’s classic tailwaters: big sulphur hatches, special-regulation trophy water below Norris Dam,
  and a famous mid-river sandbar flats scene. Flow is TVA-driven; the gauge below the dam is the wade-window
  truth-teller. The tailwater runs from Norris Dam through Melton Hill Lake down to the Clinch mouth at
  Kingston / Watts Bar Lake.


  Regulations: Norris Dam downstream to Hwy 61 bridge (incl. tributaries): 14–20 in PLR on all trout; 7-trout
  creel, only 1 over 20 in (retrieved 2026-09-14; verify current rules with TWRA before you go).
