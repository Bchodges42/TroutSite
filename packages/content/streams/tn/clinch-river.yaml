  statement: TWRA's 2026 forecast calls the Clinch River below Norris Dam one of Tennessee's premier
    trout destinations — ~14 miles of year-round water with documented natural reproduction plus
    annual brook/brown/rainbow stocking — and late-February 2026 electrofishing found catch rates at
    10-year averages with strong natural recruitment.
  reachScope: Clinch River below Norris Dam (Norris Tailwater), Anderson County — approximately 14
    miles from Norris Dam to the Hwy 61 Bridge at Clinton; downstream of Hwy 61 the river impounds
    into Melton Hill Lake (separate catalog water)
