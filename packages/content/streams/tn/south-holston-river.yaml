notes: >-
  A weir dam evens out TVA releases below South Holston Dam, giving one of the East’s richest tailwaters:
  dense wild brown and rainbow populations plus TWRA-stocked rainbows. Ideal-flow band spans typical one- to
  two-turbine generation; the river is comfortably wadeable only below roughly 1,000 cfs — always check the
  TVA release schedule first. The tailwater runs from South Holston Dam down to the Boone Lake arm head.


  Regulations: "South Holston Dam to Boone, including Boone Reservoir upstream to the Hwy 11E Bridge": 16–22
  in PLR on all trout; 7-trout creel, only 1 over 22 in; closed to ALL fishing Nov 1–Jan 31 (Hickory Tree
  Bridge upstream to Bottom Creek confluence; (retrieved 2026-09-14; verify current rules with TWRA before you
  go).
