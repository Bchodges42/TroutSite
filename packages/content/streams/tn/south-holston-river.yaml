id: south-holston-river
name: South Fork Holston River (South Holston tailwater)
stateId: TN
waterbodyType: tailrace
display: featured
regionId: tn-east-holston
gaugeIds:
  - "tva:SHDT1"
stockingProgram: true
species: trout
fishery: tailwater
yearRound: true
idealFlow:
  - min: 250
    max: 2500
    unit: cfs
idealFlowSource: editorial
seasonMonths: [3, 4, 5, 6, 7, 8, 9 ]
seasonKind: programmatic
notes: >-
  A weir dam evens out TVA releases below South Holston Dam, giving one of the East’s richest
  tailwaters: dense wild brown and rainbow populations plus TWRA-stocked rainbows. Ideal-flow band spans
  typical one- to two-turbine generation; the river is comfortably wadeable only below roughly 1,000 cfs
  — always check the TVA release schedule first. The tailwater runs from South Holston Dam down to
  the Boone Lake arm head.

