id: south-holston-river
name: South Fork Holston River (South Holston tailwater)
stateId: TN
waterbodyType: tailrace
regionId: tn-east-holston
gaugeIds:
  - "03476500"
stockingProgram: true
species: trout
idealFlow:
  - min: 250
    max: 2500
    unit: cfs
notes: "A weir dam evens out TVA releases below South Holston Dam, giving one of the East’s
  richest tailwaters: dense wild brown and rainbow populations plus TWRA-stocked rainbows.
  Ideal-flow band spans typical one- to two-turbine generation; the river is comfortably
  wadeable only below roughly 1,000 cfs — always check the TVA release schedule first."
