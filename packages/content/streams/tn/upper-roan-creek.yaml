      pinpoint: 4 'Upper Roan Creek' rows, Johnson County, Seasonal, Rainbow Trout - weeks 3/22, 4/19,
        5/17, 6/14/2026 (observed months Mar-Jun)
    - label: Roan Creek temperature grabs
      url: https://www.waterqualitydata.us/data/Result/search?siteid=USGS-03482000&characteristicName=Temperature,%20water&mimeType=csv
      kind: temperature-series
      observationPeriod: 1975-1988 and 2006 grabs
      retrieved: 2026-09-18
      pinpoint: 17.0 C (Jul 1988) near Neva below the forks; lower main stem 18.9-26.1 C (1975-76)
  caveats:
    - "2026 stocking weeks: March 22, April 19, May 17 and June 14 - fish soon after releases."
    - The special trout regulation on Roan Creek (Mountain Lake Estates Bridge downstream to Doe
      Creek) applies to the LOWER main stem - a different reach from this catalog entry.
    - Roan Creek (any reach) is absent from TWRA's wild-trout list; no wild population is documented
      for the upper creek.
