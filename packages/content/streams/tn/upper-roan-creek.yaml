  statement: TWRA stocks the upper Roan Creek weekly-to-biweekly across spring and early summer
    (March-June 2026 stocking weeks); the nearest gauge below the headwater forks once grabbed 17 C
    in July, but no year-round trout fishery is documented and the catalog's winter season label
    contradicts the schedule.
