notes: >-
  Reference waterbody from the Tennessee waterways inventory — the west-flowing Wolf
  through Fayette and Shelby counties; a different water from the Fentress County
  headwaters of the same name. USGS 07031650 provides flow and stage context for the western
  reach. Detailed angler notes are still being prepared — check
  TWRA and local access areas in the meantime.
  TWRA's statewide regulation exceptions include this river in the shared West Tennessee crappie rule: 30 per day, no length limit. (see officialSources).
