notes: >-
  The famous Lilly Bridge gorge in the Obed Wild & Scenic River. Gauge at Lilly Bridge is the
  go/no-go read.


  Correction (2026-09-15): agency sources document a warmwater fishery with no trout program or
  record — Obed-system creek; warmwater fish community, zero salmonids in NPS records, summer temps
  ~30 °C. (retrieved 2026-09-14).


