notes: >-
  Big-volume border river driven by upstream generation at Waterville (NC). The TN Hartford reach is popular
  whitewater and holds trout in cooler months; TWRA’s stocking dataset does not currently list the TN reach —
  set conservatively, verify locally. It runs the Hartford corridor from the NC line down to the Douglas Lake
  arm. TWRA's statewide regulation exceptions carry a smallmouth/black bass rule for this river. (see
  officialSources).


  Regulations: Smallmouth 1/day, 20-in minimum; Walleye 15-in minimum, walleye/sauger 5/day combo, only 1
  sauger over 16 in/day — Hwy 321 bridge at Newport upstream to NC line (the full TN reach incl. Hartford)
  (retrieved 2026-09-14; verify current rules with TWRA before you go).

    Prominence A species fill (high): wave-3 ledger: Managed warmwater river (smallmouth/walleye, state-record redhorse); trout row pairing unconfirmable in schedule scrape; troutEvidence=none — 
