id: pigeon-river
name: Pigeon River (Hartford corridor)
stateId: TN
waterbodyType: river
regionId: tn-east-pigeon-frenchbroad
gaugeIds:
  - "03461500"
stockingProgram: false
species: trout
idealFlow:
  - min: 300
    max: 1500
    unit: cfs
notes: >-
  Big-volume border river driven by upstream generation at Waterville (NC). The TN Hartford reach is
  popular whitewater and holds trout in cooler months; TWRA’s stocking dataset does not currently list
  the TN reach — set conservatively, verify locally. It runs the Hartford corridor from the NC line
  down to the Douglas Lake arm.
  TWRA's statewide regulation exceptions carry a smallmouth/black bass rule for this river. (see officialSources).

