notes: >-
  Tennessee River reservoir from Watts Bar Dam (USGS 03543005 tailwater gauge, 35.62035/-84.78328;
  Tennessee River mile 529.9) upstream 72.4 miles to Fort Loudoun Dam, across Roane, Meigs, Rhea,
  and Loudon counties — including the Clinch arm up to Melton Hill Dam (melton-hill-lake) and the
  Emory River arm. Discharges through Watts Bar Dam into Chickamauga Lake. TVA lists the reservoir
  at 39,090 ac at full pool. TWRA's Watts Bar Reservoir page lists the fishery as largemouth bass,
  smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
  Striped bass is a regulatory or hybrid-evidence tag here; reservoir temperature/oxygen refuge
  context is not a scored input.


  Regulations: Black Bass 5/day 15-inch; Crappie 15/day 10-inch; Catfish 34-inch rule; Striped
  Bass/Hybrid — Apr 1-Oct 31: 2/day 15-inch, Nov 1-Mar 31: 2/day only one striped bass (15-inch
  hybrid / 36-inch striper Nov-Mar); White Bass 15/day; Walleye 5/day 16-inch; (retrieved
  2026-09-14; verify current rules with TWRA before you go).
