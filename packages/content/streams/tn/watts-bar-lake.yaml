notes: >-
  Tennessee River reservoir from Watts Bar Dam (USGS 03543005 tailwater gauge,
  35.62035/-84.78328; Tennessee River mile 529.9) upstream 72.4 miles to Fort
  Loudoun Dam, across Roane, Meigs, Rhea, and Loudon counties — including the
  Clinch arm up to Melton Hill Dam (melton-hill-lake) and the Emory River arm.
  Discharges through Watts Bar Dam into Chickamauga Lake. TVA lists the
  reservoir at 39,090 ac at full pool.
  TWRA's Watts Bar Reservoir page lists the fishery as largemouth bass, smallmouth bass, spotted bass, crappie, bluegill, catfish, striped bass (see officialSources).
