      kind: agency-assessment
      observationPeriod: survey-derived abundance figures quoted (catfish/hour)
      retrieved: 2026-09-22
      pinpoint: "'If you are looking to balance numbers and size, this stretch of the Duck River is among
        the best for catfish in middle Tennessee'; '53.2 catfish/hour'; Centerville-to-mouth habitat
        'dominated by large pools, snags and trees, sand bars, and long wide shoals'; channel
        catfish '38.8/hour, averaging 13\"'; 'trophy smallmouth and flathead catfish'"
    - label: Tennessee Scenic Rivers — Duck
      url: https://www.tn.gov/environment/natural-areas/tn-scenic-rivers/duck.html
      kind: legal-designation
      retrieved: 2026-09-22
      pinpoint: River 'flows through seven middle Tennessee counties before reaching its confluence with
        the Tennessee River near New Johnsonville' (prior lead quoting the TDEC page; page not
