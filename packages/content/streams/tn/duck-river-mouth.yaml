  statement: TWRA documents the lower Duck River as a premier warmwater float river — 'among the best
    for catfish in middle Tennessee' from Columbia to Centerville and trophy smallmouth and flathead
    water from Centerville to the mouth — with no trout program on the reach.
  reachScope: Columbia to the Tennessee River confluence near New Johnsonville
    (Maury/Hickman/Humphreys counties)
  asOf: "2026"
  sources:
