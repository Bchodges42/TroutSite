  caveats:
    - The shared Fishbrain Duck River page (217 rainbow rows) is river-wide; its trout content
      reflects the upstream Normandy tailwater and is a research lead only.
    - Seasonal rainbow programs in the same counties (Cane Creek, Mill Creek — Hickman; Hurricane
      Creek — Humphreys) are separate small creeks.
