notes: The reach the catalog was missing — roughly 100 river miles from Columbia (Maury Co)
  down through the Western Highland Rim to the Tennessee River confluence near
  New Johnsonville (Humphreys Co). Same agency-documented warmwater fishery as the rest of
  the Duck — TWRA documents largemouth/smallmouth/spotted bass, rock bass and catfish with
  150+ fish species river-wide; gauge drainage grows from ~1,030 sq mi above Columbia to
  2,557 sq mi at Hurricane Mills, so the editorial flow band is deliberately wide. The
  2026 scenic river amendment designates this reach (Class II Pastoral segments below
  Columbia). Float-fish country — TWRA lists ~30 fee-free access sites river-wide; on this
  reach the USGS gauge crossings (Hwy 100 at Centerville, Hurricane Mills) are the
  documented public anchors, and the TWRA boating/fishing access map carries the full
  ramp list.
