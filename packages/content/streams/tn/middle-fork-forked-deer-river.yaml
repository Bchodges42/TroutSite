  statement: TWRA manages the Forked Deer rivers under a West Tennessee crappie rule (30/day, no
    length limit), documenting a managed warmwater fishery on the Middle Fork; no trout program and
    no trout record exists for this fork, and no reach-specific fishery survey was found.
