notes: >-
  NPS lists vehicle parking and picnic sites along Little River, with a Tennessee
  or North Carolina fishing license required. The Metcalf bridge has a 10-ton
  weight limit; buses, motorhomes and trailers are not permitted. Dumpsters are
  removed from late October to late March; pack out trash during that period.
uncertainty: >-
  Reviewed against the official NPS page; no on-site visit or entry coordinates
  were verified. Bank routes, accessible water entry, current closures and
  parking requirements must be checked with NPS before departure.
